name: Enforce single status label

on:
  issues:
    types: [labeled]

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Remove other status labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const addedLabel = context.payload.label.name;

            const groupPrefix = "status:";

            if (!addedLabel.startsWith(groupPrefix)) return;

            const allLabels = issue.labels.map(l => l.name);

            const labelsToRemove = allLabels.filter(l =>
              l.startsWith(groupPrefix) && l !== addedLabel
            );

            for (const label of labelsToRemove) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name: label
              });
            }