name: Enforce only one label on issues

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  enforce-single-label:
    runs-on: ubuntu-latest

    steps:
      - name: Keep only the newest label
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.issue.number;
            const addedLabel = context.payload.label.name;

            console.log("New label added:", addedLabel);

            // ✅ Get fresh list of labels (IMPORTANT)
            const { data: labels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number
            });

            const labelNames = labels.map(l => l.name);

            console.log("All labels before cleanup:", labelNames);

            // ✅ Remove everything except the newly added label
            const toRemove = labelNames.filter(name => name !== addedLabel);

            console.log("Removing labels:", toRemove);

            for (const name of toRemove) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number,
                name
              });
            }

            console.log("Done. Only one label remains.");
