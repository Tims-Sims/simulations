name: Enforce single status label

on:
  issues:
    types: [labeled]

permissions:
  issues: write

jobs:
  enforce:
    runs-on: ubuntu-latest
    steps:
      - name: Remove other status labels
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const addedLabel = context.payload.label.name;

            const prefix = "status:";

            if (!addedLabel.startsWith(prefix)) {
              console.log("Not a status label, skipping");
              return;
            }

            const labelsToRemove = issue.labels
              .map(l => l.name)
              .filter(name => name.startsWith(prefix) && name !== addedLabel);

            console.log("Removing:", labelsToRemove);

            for (const name of labelsToRemove) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                name
              });
            }