name: Sync Project Status → Issue Labels

on:
  projects_v2_item:
    types: [edited]

permissions:
  issues: write
  contents: read
  projects: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync Status to Labels
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const STATUS_TO_LABEL = {
              "Developer Needed": "dev needed",
              "In Progress": "in progress",
              "Review Needed": "review needed",
              "Changes Needed": "changes needed",
              "Ready for Final Review": "done"
            };

            const ALL_LABELS = Object.values(STATUS_TO_LABEL);

            const itemId = context.payload.projects_v2_item.node_id;

            const query = `
              query($id: ID!) {
                node(id: $id) {
                  ... on ProjectV2Item {
                    content {
                      ... on Issue {
                        number
                        repository {
                          owner { login }
                          name
                        }
                        labels(first: 20) {
                          nodes { name }
                        }
                      }
                    }
                    fieldValues(first: 20) {
                      nodes {
                        ... on ProjectV2ItemFieldSingleSelectValue {
                          name
                          field {
                            ... on ProjectV2FieldCommon {
                              name
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const result = await github.graphql(query, { id: itemId });

            const item = result.node;
            const issue = item?.content;

            if (!issue || !issue.number) {
              console.log("No issue linked to this project item.");
              return;
            }

            const statusField = item.fieldValues.nodes.find(
              f => f?.field?.name === "Status"
            );

            const status = statusField?.name;

            if (!status) {
              console.log("No Status field found.");
              return;
            }

            const newLabel = STATUS_TO_LABEL[status];

            if (!newLabel) {
              console.log(`Status '${status}' not mapped.`);
              return;
            }

            const repo = issue.repository;

            const existingLabels = issue.labels.nodes.map(l => l.name);

            // Remove old status labels
            for (const label of existingLabels) {
              if (ALL_LABELS.includes(label)) {
                try {
                  await github.rest.issues.removeLabel({
                    owner: repo.owner.login,
                    repo: repo.name,
                    issue_number: issue.number,
                    name: label
                  });
                } catch (e) {
                  console.log(`Could not remove label: ${label}`);
                }
              }
            }

            // Add correct label
            await github.rest.issues.addLabels({
              owner: repo.owner.login,
              repo: repo.name,
              issue_number: issue.number,
              labels: [newLabel]
            });

            console.log(`Applied label: ${newLabel}`);