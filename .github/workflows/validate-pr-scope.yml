name: Validate PR Scope

on:
  pull_request:
    branches: [main]

jobs:
  validate-scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure changes are within a single folder
        run: |
          # Get all files changed compared to main
          CHANGED=$(git diff --name-only origin/main...HEAD)

          if [ -z "$CHANGED" ]; then
            echo "No changes detected."
            exit 1
          fi

          echo "Changed files:"
          echo "$CHANGED"

          # Extract the top-level folder for each changed file
          FOLDERS=$(echo "$CHANGED" | awk -F/ 'NF>1 {print $1}' | sort -u)
          FOLDER_COUNT=$(echo "$FOLDERS" | grep -c .)

          if [ "$FOLDER_COUNT" -ne 1 ]; then
            echo ""
            echo "❌ ERROR: Changes must be contained within a single folder."
            echo "   Found changes in: $FOLDERS"
            exit 1
          fi

          echo ""
          echo "✅ All changes are within folder: $FOLDERS"