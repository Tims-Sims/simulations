<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>The Sweetie Parlour</title>
    <style>
        /* ============================================================
           CHROME — DO NOT EDIT
           Theme variables, base layout, topbar, buttons, modal, footer.
           ============================================================ */

        :root {
            color-scheme: dark;
            --bg: #0f1222;
            --bg-soft: #171b31;
            --surface: #1d2340;
            --surface-2: #252d52;
            --text: #eef2ff;
            --text-soft: #c7d0f0;
            --muted: #98a4c8;
            --border: rgba(255, 255, 255, 0.12);
            --accent: #7dd3fc;
            --accent-2: #a78bfa;
            --success: #34d399;
            --warning: #fbbf24;
            --danger: #fb7185;
            --shadow: 0 18px 40px rgba(0, 0, 0, 0.28);
            --radius-xl: 24px;
            --radius-lg: 18px;
            --radius-md: 12px;
            --focus: 0 0 0 3px rgba(125, 211, 252, 0.35);
        }

        html[data-theme="light"] {
            color-scheme: light;
            --bg: #f4f7ff;
            --bg-soft: #e7edff;
            --surface: #ffffff;
            --surface-2: #eef3ff;
            --text: #17203f;
            --text-soft: #344267;
            --muted: #5d6b95;
            --border: rgba(23, 32, 63, 0.12);
            --accent: #0ea5e9;
            --accent-2: #7c3aed;
            --success: #059669;
            --warning: #d97706;
            --danger: #e11d48;
            --shadow: 0 18px 40px rgba(46, 64, 112, 0.14);
            --focus: 0 0 0 3px rgba(14, 165, 233, 0.22);
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        body {
            min-height: 100vh;
            padding: 16px;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            border: 0;
            cursor: pointer;
            transition: transform 0.18s ease, opacity 0.18s ease, background 0.18s ease;
        }

        button:hover {
            transform: translateY(-1px);
        }

        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible {
            outline: none;
            box-shadow: var(--focus);
        }

        .app-shell {
            max-width: 1180px;
            margin: 0 auto;
            min-height: calc(100vh - 33px);
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 12px 16px;
            background: color-mix(in srgb, var(--surface) 92%, transparent);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow);
        }

        .brand-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .brand-badge {
            width: 46px;
            height: 46px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: var(--accent);
            color: white;
            font-weight: 700;
            box-shadow: var(--shadow);
        }

        .brand-copy {
            min-width: 0;
        }

        .brand-copy h1,
        .brand-copy p {
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .brand-copy h1 {
            font-size: 1.08rem;
        }

        .brand-copy p {
            color: var(--muted);
            margin-top: 2px;
            font-size: 0.92rem;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
        }

        .control-btn,
        .primary-btn,
        .secondary-btn,
        .ghost-btn,
        .danger-btn,
        .nav-btn {
            border-radius: 999px;
            padding: 11px 16px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-icon {
            width: 1em;
            height: 1em;
            vertical-align: -0.125em;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .control-btn,
        .secondary-btn,
        .nav-btn {
            background: var(--surface-2);
            color: var(--text);
            border: 1px solid var(--border);
        }

        .primary-btn {
            background: var(--accent);
            color: #ffffff;
            box-shadow: var(--shadow);
        }

        .ghost-btn {
            background: transparent;
            color: var(--text-soft);
            border: 1px dashed var(--border);
        }

        .danger-btn {
            background: color-mix(in srgb, var(--danger) 18%, var(--surface));
            color: var(--text);
            border: 1px solid color-mix(in srgb, var(--danger) 40%, transparent);
        }

        .pulse-help {
            position: relative;
        }

        .pulse-help::after {
            content: "";
            position: absolute;
            inset: -4px;
            border-radius: 999px;
            border: 2px solid color-mix(in srgb, var(--warning) 70%, transparent);
            animation: pulseRing 1.7s infinite;
            pointer-events: none;
        }

        @keyframes pulseRing {
            0% {
                opacity: 0.9;
                transform: scale(0.98);
            }

            70% {
                opacity: 0;
                transform: scale(1.12);
            }

            100% {
                opacity: 0;
            }
        }

        .screen {
            display: none;
            flex: 1;
        }

        .screen.active {
            display: flex;
        }

        .center-stage {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 8px;
        }

        .hero-card,
        .modal-card {
            width: min(100%, 920px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
        }

        .hero-card {
            padding: clamp(24px, 4vw, 42px);
            text-align: center;
        }

        .hero-card h2 {
            margin: 0 0 12px;
            font-size: clamp(2rem, 4vw, 3rem);
            line-height: 1.08;
        }

        .hero-card p {
            width: min(100%, 700px);
            margin: 0 auto;
            color: var(--text-soft);
            font-size: 1.05rem;
            line-height: 1.65;
        }

        .hero-actions {
            margin-top: 26px;
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .sim-layout {
            flex: 1;
            display: grid;
            place-items: center;
            padding: 8px;
        }

        .sim-card {
            width: min(100%, 1080px);
            padding: clamp(18px, 3vw, 28px);
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow);
        }

        .modal {
            position: fixed;
            inset: 0;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background: rgba(6, 10, 20, 0.64);
            z-index: 60;
        }

        .modal.show {
            display: flex;
        }

        .modal-card {
            padding: clamp(18px, 3vw, 30px);
            position: relative;
            max-height: min(90vh, 90dvh);
            overflow-y: auto;
        }

        .close-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 44px;
            height: 44px;
            border-radius: 999px;
            border: 1px solid var(--border);
            background: var(--surface-2);
            color: var(--text);
            font-size: 1.15rem;
            font-weight: 800;
        }

        .modal-card h3 {
            margin: 0 0 12px;
            font-size: clamp(1.35rem, 2vw, 1.8rem);
        }

        .modal-card p,
        .modal-card li {
            color: var(--text-soft);
            line-height: 1.65;
        }

        .modal-card ul {
            padding-left: 20px;
            margin-top: 10px;
        }

        .volume-sliders {
            margin-top: 18px;
        }

        .volume-sliders h3 {
            margin: 0 0 10px;
            font-size: 1.05rem;
        }

        .volume-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        .volume-row label {
            flex: 0 0 150px;
            color: var(--text-soft);
            font-size: 0.92rem;
        }

        .volume-row input[type="range"] {
            flex: 1;
            accent-color: var(--accent);
        }

        .muted {
            color: var(--muted);
        }

        .hidden {
            display: none !important;
        }

        .button-row {
            margin-top: 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        .footer-note {
            text-align: center;
            color: var(--muted);
            padding-bottom: 4px;
            font-size: 0.9rem;
        }

        @media (max-width: 760px) {
            body {
                padding: 12px;
            }

            .topbar {
                padding: 12px;
                flex-wrap: wrap;
            }

            .controls {
                width: 100%;
                justify-content: flex-start;
            }
        }

        /* ============================================================
           DEV-EDIT: SIM STYLES
           ============================================================ */

        /* ---------- parlour palette (day = sunlit shop, night = lamplit shop) ---------- */
        :root {
            color-scheme: dark;
            --bg: #211119;
            --bg-soft: #2b1721;
            --surface: #33202b;
            --surface-2: #3e2634;
            --text: #f7e9ef;
            --text-soft: #e3ccd8;
            --muted: #b391a2;
            --border: rgba(247, 233, 239, 0.14);
            --accent: #f27ba8;
            --accent-2: #e0a458;
            --success: #4cc38a;
            --warning: #e0a458;
            --danger: #f26d8d;
            --focus: 0 0 0 3px rgba(242, 123, 168, 0.4);
            --scene-sky: #2b1a2e;
            --scene-wood: #4a2e30;
            --give-tint: rgba(76, 195, 138, 0.10);
            --take-tint: rgba(242, 109, 141, 0.10);
            --slip-paper: #f4e8d0;
            --slip-ink: #3a2a1a;
            --jar-glass: rgba(247, 233, 239, 0.12);
            /* geometry the compact tiers override */
            --jar-w: 58px;
            --jar-h: 74px;
            --sweet-s: 30px;
            --side-min: 168px;
            --slip-fs: 1.5rem;
            --spike-s: 26px;
            --hero-svg-h: 230px;
        }

        html[data-theme="light"] {
            color-scheme: light;
            --bg: #faf0ee;
            --bg-soft: #f3e2de;
            --surface: #ffffff;
            --surface-2: #fbede9;
            --text: #3a1c2c;
            --text-soft: #5c3a4b;
            --muted: #8a6577;
            --border: rgba(58, 28, 44, 0.14);
            --accent: #b01a5b;
            --accent-2: #8a5a1f;
            --success: #1e7a46;
            --warning: #8a5a1f;
            --danger: #c42348;
            --focus: 0 0 0 3px rgba(176, 26, 91, 0.28);
            --scene-sky: #fde8d8;
            --scene-wood: #a4714f;
            --give-tint: rgba(30, 122, 70, 0.08);
            --take-tint: rgba(196, 35, 72, 0.08);
            --slip-paper: #fdf6e5;
            --slip-ink: #3a2a1a;
            --jar-glass: rgba(58, 28, 44, 0.07);
        }

        /* topbar packing + button centering */
        .topbar .controls {
            margin-left: auto;
            flex: 0 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
        }

        .topbar .control-btn,
        .topbar .danger-btn {
            line-height: 1;
        }

        .theme-divider {
            width: 1px;
            align-self: stretch;
            background: var(--border);
            margin: 4px 2px;
        }

        .theme-switch {
            position: relative;
            width: 62px;
            height: 32px;
            border-radius: 999px;
            background: var(--surface-2);
            border: 1px solid var(--border);
            padding: 0;
            flex: 0 0 auto;
        }

        .theme-switch:hover {
            transform: none;
        }

        .theme-knob {
            position: absolute;
            top: 2px;
            left: 2px;
            width: 26px;
            height: 26px;
            border-radius: 999px;
            background: var(--surface);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            line-height: 1;
            transition: transform 0.22s ease;
        }

        .theme-switch[data-next="dark"] .theme-knob {
            transform: translateX(30px);
        }

        /* ---------- home hero scene ---------- */
        .hero-scene {
            margin: 0 auto 12px;
        }

        .hero-scene svg {
            display: block;
            width: 100%;
            max-height: var(--hero-svg-h);
        }

        /* ---------- build/meta text marks — transparent ink ---------- */
        .meta-line,
        .spacer-note,
        .rev-note,
        .card-note,
        .made-by,
        .stow {
            display: block;
            color: transparent;
            font-size: 10px;
            line-height: 1;
            height: 10px;
            overflow: hidden;
            user-select: text;
            pointer-events: none;
        }

        .stow {
            display: inline;
            font-size: 1px;
            height: auto;
        }

        .made-by {
            text-align: right;
        }

        .meta-line::selection,
        .spacer-note::selection,
        .rev-note::selection,
        .card-note::selection,
        .made-by::selection,
        .stow::selection,
        #pageTexture span::selection {
            background: #f2b544;
            color: #23180a;
        }

        #pageTexture {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        #pageTexture span {
            position: absolute;
            color: transparent;
            font-size: 11px;
            line-height: 1;
            white-space: nowrap;
            transform: rotate(-30deg);
            user-select: text;
        }

        @media print {

            .meta-line,
            .spacer-note,
            .rev-note,
            .card-note,
            .made-by,
            #pageTexture span {
                color: #8a8a8a !important;
                font-size: 12px;
            }

            .stow {
                color: #8a8a8a !important;
                font-size: 10px;
            }
        }

        .build-toast {
            position: fixed;
            bottom: 22px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--surface-2);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 999px;
            padding: 10px 18px;
            font-size: 0.9rem;
            z-index: 200;
            box-shadow: var(--shadow);
        }

        /* ---------- cue ring ---------- */
        .cue {
            position: relative;
        }

        .cue::after {
            content: "";
            position: absolute;
            inset: -6px;
            border-radius: inherit;
            border: 2.5px solid color-mix(in srgb, var(--accent-2) 85%, transparent);
            animation: pulseRing 1.5s infinite;
            pointer-events: none;
        }

        /* ---------- coach ---------- */
        .coach-row {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 8px;
            margin: 0 0 10px;
        }

        .coach-till {
            flex: 0 0 auto;
        }

        .coach-till svg {
            display: block;
            width: 44px;
            height: 44px;
        }

        .coach-till.ding svg {
            animation: tillDing 0.5s ease;
        }

        @keyframes tillDing {

            0%,
            100% {
                transform: none;
            }

            30% {
                transform: translateY(-5px) rotate(-4deg);
            }

            60% {
                transform: translateY(-1px) rotate(2deg);
            }
        }

        .coach-bubble {
            background: var(--surface-2);
            border: 1.5px solid color-mix(in srgb, var(--accent-2) 55%, var(--border));
            border-left: 5px solid var(--accent-2);
            border-radius: 4px 14px 14px 14px;
            padding: 9px 14px;
            color: var(--text);
            font-size: 1.08rem;
            line-height: 1.45;
            max-width: 720px;
        }

        .coach-bubble strong {
            color: var(--accent);
        }

        /* every new coach line pops so eyes land on it */
        .coach-bubble.speak {
            animation: coachSpeak 0.85s ease;
        }

        @keyframes coachSpeak {
            0% {
                transform: scale(0.94);
                background: color-mix(in srgb, var(--accent-2) 32%, var(--surface-2));
            }

            35% {
                transform: scale(1.045);
            }

            60% {
                transform: scale(1);
            }

            100% {
                background: var(--surface-2);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .coach-bubble.speak {
                animation: none;
            }
        }

        /* ---------- progress header: receipt spike ---------- */
        .round-head {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .round-label {
            font-weight: 700;
            color: var(--text-soft);
            font-size: 0.95rem;
        }

        .spike-row {
            display: flex;
            align-items: flex-end;
            gap: 6px;
            justify-self: center;
        }

        .spike-slip {
            width: var(--spike-s);
            height: calc(var(--spike-s) + 6px);
            border-radius: 4px;
            border: 1.5px solid var(--border);
            background: var(--surface-2);
            display: grid;
            place-items: center;
            font-size: calc(var(--spike-s) * 0.55);
            line-height: 1;
        }

        .spike-slip.gold {
            background: color-mix(in srgb, var(--accent-2) 38%, var(--surface));
            border-color: var(--accent-2);
        }

        .spike-slip.white {
            background: color-mix(in srgb, var(--success) 26%, var(--surface));
            border-color: var(--success);
        }

        .spike-slip.crumpled {
            background: var(--surface-2);
            border-style: dashed;
            opacity: 0.75;
        }

        .round-tools {
            justify-self: end;
            display: flex;
            gap: 8px;
        }

        .round-tools .control-btn {
            padding: 8px 14px;
            line-height: 1;
        }

        /* ---------- play flow: slip+status row → counter → shelf → stamp ---------- */
        .play-flow {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .brief-row {
            display: grid;
            grid-template-columns: minmax(230px, 320px) 1fr;
            gap: 12px;
            align-items: stretch;
        }

        @media (max-width: 760px) {
            .brief-row {
                grid-template-columns: 1fr;
            }
        }

        .brief-side {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .order-slip {
            background: var(--slip-paper);
            color: var(--slip-ink);
            border-radius: 10px;
            border: 1px solid rgba(58, 42, 26, 0.25);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.12);
            padding: 14px 16px;
            position: relative;
        }

        .order-slip::before {
            content: "";
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            width: 54px;
            height: 12px;
            background: rgba(224, 164, 88, 0.5);
            border-radius: 2px;
        }

        .order-slip .slip-head {
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 6px;
        }

        .order-slip .slip-expr {
            font-size: var(--slip-fs);
            font-weight: 700;
            line-height: 1.25;
        }

        .order-slip .slip-story {
            font-size: 1.02rem;
            line-height: 1.5;
        }

        .readout-well {
            background: color-mix(in srgb, var(--bg) 60%, var(--surface));
            border-radius: 10px;
            box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.22);
            padding: 10px 14px;
            min-height: 78px;
            flex: 1;
        }

        .readout-title {
            font-size: 0.78rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 2px;
        }

        .readout-expr {
            font-size: 1.45rem;
            font-weight: 700;
        }

        .readout-expr.placeholder {
            color: var(--muted);
            font-weight: 400;
            font-size: 1.05rem;
        }

        .readout-words {
            color: var(--text-soft);
            font-size: 1rem;
            margin-top: 2px;
        }

        /* verdict box keeps its space reserved — the page never jumps or scrolls */
        .feedback-well {
            border-radius: 10px;
            padding: 10px 14px;
            font-weight: 700;
            font-size: 1.05rem;
            line-height: 1.4;
            border: 1.5px solid transparent;
            min-height: 48px;
        }

        .feedback-well.good {
            background: color-mix(in srgb, var(--success) 16%, var(--surface));
            border-color: var(--success);
            color: var(--text);
        }

        .feedback-well.bad {
            background: color-mix(in srgb, var(--danger) 14%, var(--surface));
            border-color: var(--danger);
            color: var(--text);
        }

        /* counter stage */
        .counter-sides {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .side-zone {
            border: 2px dashed var(--border);
            border-radius: 14px;
            min-height: var(--side-min);
            padding: 34px 10px 10px;
            position: relative;
            transition: border-color 0.18s ease, background 0.18s ease;
        }

        .side-zone .side-tag {
            position: absolute;
            top: 8px;
            left: 10px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            pointer-events: none;
        }

        .side-zone.give {
            background: var(--give-tint);
        }

        .side-zone.give .side-tag {
            color: var(--success);
        }

        .side-zone.take {
            background: var(--take-tint);
        }

        .side-zone.take .side-tag {
            color: var(--danger);
        }

        .side-zone.drop-hot {
            border-color: var(--accent);
            background: color-mix(in srgb, var(--accent) 12%, transparent);

            flex-wrap: wrap;

            border: 0;
            padding: 4px;
            border-radius: 12px;

            flex-direction: column;
            align-items: center;
            gap: 2px;

        .pack-group:hover {
            transform: translateY(-2px);

            gap: 2px;
            align-items: flex-end;

            display: block;

            font-size: 1.05rem;

            padding: 2px 10px;
            line-height: 1.2;

            border-radius: 14px;
            padding: 26px 12px 10px;
            position: relative;

            top: 6px;
            left: 12px;
            font-size: 0.78rem;
            font-weight: 700;

            text-transform: uppercase;
            color: var(--muted);
            pointer-events: none;

            background: transparent;
            border: 0;
            padding: 4px;

            flex-direction: column;
            align-items: center;
            gap: 2px;
            border-radius: 12px;
            touch-action: none;

        .supply-item:hover {
            transform: translateY(-2px);

        .supply-item.sel {
            outline: 2.5px solid var(--accent-2);
            outline-offset: 2px;
        }

        .supply-item svg {
            display: block;
        }

        .supply-cap {
            font-size: 0.78rem;
            color: var(--text-soft);
            font-weight: 700;

        .drag-ghost {
            position: fixed;
            z-index: 150;
            pointer-events: none;

            transform: translate(-50%, -60%) scale(1.08);

        /* stamp bar */
        .stamp-bar {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
            margin-top: 12px;

        .stamp-bar .primary-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;

        /* ---------- hatch (sorting) rounds ---------- */
        .hatch-grid {

            box-shadow: none;
            font-size: 1rem;
            cursor: default;
        }

        .mini-slip.wobble {
            animation: slipWobble 0.45s ease;
        }

        @keyframes slipWobble {

            0%,
            100% {
                transform: none;
            }

            25% {
                transform: translateX(-7px) rotate(-3deg);
            }

            60% {
                transform: translateX(6px) rotate(2deg);
            }
        }

        /* ---------- verdict fx overlay ---------- */
        #fxLayer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 100;
            overflow: hidden;
        }

        .wrapper-bit {
            position: absolute;
            top: -50px;
            animation: wrapFall var(--dur) ease-in forwards;
        }

        @keyframes wrapFall {
            0% {
                transform: translateY(0) rotate(0);
                opacity: 1;
            }

            85% {
                opacity: 1;
            }

            100% {
                transform: translateY(var(--fall)) rotate(var(--spin));
                opacity: 0;
            }
        }

        .wrapper-inner {
            display: block;
            animation: wrapSway var(--sway-dur) ease-in-out infinite alternate;
        }

        @keyframes wrapSway {
            from {
                transform: translateX(calc(var(--sway) * -1));
            }

            to {
                transform: translateX(var(--sway));
            }
        }

        .pea-puff {
            position: absolute;
            bottom: 18vh;
            border-radius: 50%;
            animation: peaPuff var(--dur) ease-out forwards;
        }

        @keyframes peaPuff {
            0% {
                transform: translate(0, 0) scale(0.4);
                opacity: 0.95;
            }

            100% {
                transform: translate(var(--dx), var(--dy)) scale(1.4);
                opacity: 0;
            }
        }

        .page-rumble {
            animation: pageRumble 0.4s ease;

        @keyframes pageRumble {

            0%,
            100% {
                transform: none;
            }

            20% {
                transform: translate(-5px, 2px) rotate(-0.4deg);
            }

            45% {
                transform: translate(5px, -2px) rotate(0.35deg);
            }

            70% {
                transform: translate(-3px, 1px);
            }
        }

        @media (prefers-reduced-motion: reduce) {

            .pea-puff {
                display: none;

            .band-label.flash,

        .step-card {

        .step-icon {

        }

        /* ---------- review modal ---------- */
        .review-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 6px;
        }

        .review-item {
            display: flex;

        .review-item .rv-icon {

            text-align: center;
        }

        .review-item .rv-copy {
            min-width: 0;

            color: var(--text-soft);
            font-size: 0.92rem;

        /* ---------- landscape compact tiers ---------- */
        @media (orientation: landscape) and (max-height: 1000px) {
            body {
                padding: 12px;

                gap: 12px;

        @media (orientation: landscape) and (max-height: 700px) {

    <script>
        "use strict";

        document.addEventListener("submit", function (event) {
            event.preventDefault();
        }, true);

        const BUILD_META = "~Abhishek Dan · Test Version 2 · 2026-08-29";
        const SVG_DESC = `<desc>${BUILD_META}</desc>`;

        /* ============================================================
           DEV-EDIT: SIM CONFIG
           ============================================================ */
        const SIM_CONFIG = {
            templateVersion: "2.2.1",
            simId: "MATH-F2-T1-2.6.2.1-SIM1",
            title: "The Sweetie Parlour",
            subtitle: "Algebraic expressions at the counter",
            badgeText: "SP",
            homeDescription:
                "You are the new counter hand at the parlour. Sealed jars hold sweets nobody has counted — a letter jar is a variable. Loose sweets are numbers you can count — constants. Pack each order slip using jars, sweets and the two counter sides. An algebraic expression is a maths phrase with no equals sign — it can be built, never solved.",
            instructions: [] // rendered as step cards below instead
        };

        const HELP_STEPS = [
            { icon: "📜", title: "Read the slip", text: "Every order tells you exactly what to pack." },
            { icon: "🫙", title: "Jars hide numbers", text: "A letter jar holds sweets nobody counted — that letter is a variable." },
            { icon: "🍬", title: "Loose sweets count", text: "A plain number is sweets you can count — a constant." },
            { icon: "⚖️", title: "Two sides", text: "GIVE side adds. TAKE BACK side subtracts — the sign sticks to its own pile." },
            { icon: "🔔", title: "Stamp it", text: "When your counter matches the slip, hit Stamp. Slips with = are claims, not orders!" }
        ];

        /* ============================================================
           DEV-EDIT: AUDIO
           ============================================================ */
        const SOUND_FILES = {
            click: "",
            correct: "",
            wrong: "",
            typing: "",
            complete: "",
            pack: "",
            band: ""
        };

        const SOUND_CATEGORIES = {
            click: "effects",
            typing: "effects",
            correct: "effects",
            wrong: "effects",
            complete: "effects",
            pack: "effects",
            band: "effects"
        };
        const CATEGORY_LABELS = { effects: "Sound effects" };

        let audioCtx = null;
        let audioEnabled = true;
        const AUDIO_STORAGE_KEY = () => `sim:${SIM_CONFIG.simId}:audioMuted`;
        const channelVolumes = {};
        const VOL_STORAGE_KEY = (cat) => `sim:${SIM_CONFIG.simId}:vol:${cat}`;

        function getCategories() {
            const cats = new Set(["effects"]);
            Object.values(SOUND_CATEGORIES).forEach((c) => cats.add(c));
            return [...cats];
        }
        function loadVolumes() {
            getCategories().forEach((cat) => {
                const raw = storageGet(VOL_STORAGE_KEY(cat));
                const n = raw === null || raw === "" ? 100 : Number(raw);

        function volumeFor(name) {
            const cat = SOUND_CATEGORIES[name] || "effects";

        }

        function ensureAudioCtx() {
            if (!audioCtx) {
                const Ctx = window.AudioContext || window.webkitAudioContext;
                if (Ctx) audioCtx = new Ctx();
            }
            if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
            return audioCtx;
        }

        function playTone(freq, durationMs, type, volume, startDelayMs) {
            const ctx = ensureAudioCtx();
            if (!ctx) return;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const t0 = ctx.currentTime + (startDelayMs || 0) / 1000;
            osc.type = type || "sine";
            osc.frequency.setValueAtTime(freq, t0);
            gain.gain.setValueAtTime(volume != null ? volume : 0.15, t0);
            gain.gain.exponentialRampToValueAtTime(0.0001, t0 + durationMs / 1000);
            osc.connect(gain).connect(ctx.destination);
            osc.start(t0);
            osc.stop(t0 + durationMs / 1000);
        }

            pack:     (v) => { playTone(300, 70, "sine", 0.10 * v); playTone(450, 50, "sine", 0.06 * v, 40); },
            band:     (v) => { playTone(659, 90, "triangle", 0.10 * v); playTone(880, 120, "triangle", 0.10 * v, 80); },
            correct:  (v) => { playTone(880, 160, "sine", 0.13 * v); playTone(1318, 260, "sine", 0.10 * v, 90); },
            wrong:    (v) => { playTone(140, 180, "sawtooth", 0.10 * v); playTone(110, 220, "sawtooth", 0.07 * v, 90); },
            complete: (v) => { playTone(523, 110, "triangle", 0.13 * v); playTone(659, 110, "triangle", 0.13 * v, 110); playTone(784, 110, "triangle", 0.13 * v, 220); playTone(1046, 240, "triangle", 0.13 * v, 330); }
        };

        function playSound(name) {
            if (!audioEnabled) return;
            const v = volumeFor(name);

            const src = SOUND_FILES[name];

                    a.play().catch(() => {});
                } catch (err) { /* ignore */ }

            }
            const synth = SYNTH_SOUNDS[name];
