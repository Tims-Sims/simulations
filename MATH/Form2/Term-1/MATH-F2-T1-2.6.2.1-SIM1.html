                <g transform="translate(280,138)"><ellipse cx="30" cy="30" rx="30" ry="8" fill="color-mix(in srgb, var(--scene-wood) 55%, black)"/><circle cx="16" cy="24" r="7" fill="#e04868"/><circle cx="30" cy="20" r="7" fill="#e0a458"/><circle cx="44" cy="24" r="7" fill="#8a5ac2"/><circle cx="23" cy="28" r="7" fill="#4a9ad4"/><circle cx="37" cy="28" r="7" fill="#4cc38a"/></g>
                <g transform="translate(450,120)"><path d="M0 48 L8 0 L52 0 L60 48 Z" fill="var(--surface-2)" stroke="var(--muted)" stroke-width="2"/><text x="30" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="var(--text)" font-family="Arial">5¢</text></g>
                <g transform="translate(620,96)"><g class="bell-sway"><line x1="20" y1="0" x2="20" y2="18" stroke="var(--muted)" stroke-width="2"/><path d="M8 40 Q8 22 20 22 Q32 22 32 40 Z" fill="var(--accent-2)"/><circle cx="20" cy="43" r="3" fill="var(--muted)"/></g></g>
                <g transform="translate(740,120)"><rect x="0" y="20" width="56" height="36" rx="6" fill="var(--jar-glass)" stroke="var(--muted)" stroke-width="2"/><rect x="16" y="8" width="24" height="14" rx="4" fill="#8a5a3a"/><circle cx="16" cy="44" r="7" fill="#e0a458"/><circle cx="32" cy="47" r="7" fill="#e04868"/><circle cx="44" cy="41" r="7" fill="#8a5ac2"/></g>
            </svg>`;
        }

        /* ---------- expression helpers ---------- */
        function numWord(n) {
            return NUM_WORDS[n] || String(n);
        }

        function letterHtml(l) {
            return `<i>${l}</i>`;
        }

        /* term: {kind:'var'|'const', letter?, count, side:'give'|'take'} */
        function exprHtml(terms) {
            let out = "";
            terms.forEach((t, i) => {
                const body = t.kind === "var"
                    ? (t.count === 1 ? letterHtml(t.letter) : t.count + letterHtml(t.letter))
                    : String(t.count);
                if (i === 0) {
                    out += (t.side === "take" ? MINUS : "") + body;
                } else {
                    out += " " + (t.side === "take" ? MINUS : "+") + " " + body;
                }
            });
            return out;
        }

        function exprWords(terms) {
            const bits = terms.map((t, i) => {
                const core = t.kind === "var"
                    ? (t.count === 1 ? `one jar of ${t.letter}` : `${numWord(t.count)} jars of ${t.letter}`)
                    : `${numWord(t.count)} loose sweet${t.count === 1 ? "" : "s"}`;
                if (i === 0) return t.side === "take" ? `take back ${core}` : core;
                return t.side === "take" ? `take back ${core}` : `add ${core}`;
            });
            return bits.join(", ");
        }

        /* counter state: {give:{vars:{}, loose:0}, take:{vars:{}, loose:0}, order:[]}
           order = [{kind, letter?, side}] in first-packed order for readout */
        function freshCounter() {
            return { give: { vars: {}, loose: 0 }, take: { vars: {}, loose: 0 }, order: [] };
        }

        function counterTerms(c) {
            const terms = [];
            c.order.forEach((o) => {
                if (o.kind === "var") {
                    const n = c[o.side].vars[o.letter] || 0;
                    if (n > 0) terms.push({ kind: "var", letter: o.letter, count: n, side: o.side });
                } else {
                    const n = c[o.side].loose;
                    if (n > 0) terms.push({ kind: "const", count: n, side: o.side });
                }
            });
            return terms;
        }

        function statesMatch(c, target) {
            const got = { give: { vars: {}, loose: 0 }, take: { vars: {}, loose: 0 } };
            ["give", "take"].forEach((s) => {
                got[s].loose = c[s].loose;
                Object.keys(c[s].vars).forEach((L) => { if (c[s].vars[L] > 0) got[s].vars[L] = c[s].vars[L]; });
            });
            const want = { give: { vars: {}, loose: 0 }, take: { vars: {}, loose: 0 } };
            target.terms.forEach((t) => {
                if (t.kind === "var") want[t.side].vars[t.letter] = (want[t.side].vars[t.letter] || 0) + t.count;
                else want[t.side].loose += t.count;
            });
            for (const s of ["give", "take"]) {
                if (got[s].loose !== want[s].loose) return false;
                const gk = Object.keys(got[s].vars), wk = Object.keys(want[s].vars);
                if (gk.length !== wk.length) return false;
                for (const L of wk) if (got[s].vars[L] !== want[s].vars[L]) return false;
            }
            return true;
        }

        /* first-difference feedback, re-stating the docx rule */
        function diffFeedback(c, target) {
            const want = { give: { vars: {}, loose: 0 }, take: { vars: {}, loose: 0 } };
            target.terms.forEach((t) => {
                if (t.kind === "var") want[t.side].vars[t.letter] = (want[t.side].vars[t.letter] || 0) + t.count;
                else want[t.side].loose += t.count;
            });
            const allLetters = new Set();
            target.terms.forEach((t) => { if (t.kind === "var") allLetters.add(t.letter); });
            Object.keys(c.give.vars).concat(Object.keys(c.take.vars)).forEach((L) => allLetters.add(L));
            for (const L of allLetters) {
                const wg = want.give.vars[L] || 0, wt = want.take.vars[L] || 0;
                const gg = c.give.vars[L] || 0, gt = c.take.vars[L] || 0;
                if (gg + gt > 0 && wg + wt === 0) return `No jars of ${L} on this slip — put them back.`;
                if (wg + wt > 0 && gg + gt === 0) return `The slip needs jars of ${L} — the letter is the part we cannot count.`;
                if (wg > 0 && gt > 0 && gg === 0) return `The jars of ${L} add — they belong on the GIVE side.`;
                if (wt > 0 && gg > 0 && gt === 0) return `The sign belongs to its term — those jars of ${L} sit on TAKE BACK.`;
                if (gg !== wg || gt !== wt) return `Count the jars of ${L} again — the coefficient says how many jars.`;
            }
            const wg = want.give.loose, wt = want.take.loose;
            if (c.give.loose !== wg || c.take.loose !== wt) {
                if (wt > 0 && c.give.loose > wg) return `The sign belongs to its term — the ${wt} goes on TAKE BACK.`;
                if (wg > 0 && c.take.loose > wt) return `That number adds — its sweets belong on the GIVE side.`;
                return "Count the loose sweets again — the constant is the plain number.";
            }
            return "Check the slip once more.";
        }

        /* ---------- round generators ---------- */
        function newLetter(used) {
            const free = LETTERS.filter((l) => !used.includes(l));
            return pick(free.length ? free : LETTERS);
        }

        function gVarIntro(used) {
            const L = newLetter(used);
            const c = randInt(2, 9);
            return {
                type: "pack",
                tag: "first-order",
                terms: [{ kind: "var", letter: L, count: 1, side: "give" }, { kind: "const", count: c, side: "give" }],
                slipExpr: true,
                coach: `A letter on its own means <strong>one jar</strong> — its coefficient is 1. Pack the order!`,
                explain: `${L} + ${c} means one jar of ${L}, add ${c} loose sweets.`
            };
        }

        function gCoef(used) {
            const L = newLetter(used);
            const n = randInt(2, 6);
            const c = randInt(2, 9);
            return {
                type: "pack",
                tag: "coefficient",
                terms: [{ kind: "var", letter: L, count: n, side: "give" }, { kind: "const", count: c, side: "give" }],
                slipExpr: true,
                coach: `${n}${L} means ${n} jars of ${L} — the <strong>coefficient</strong> counts the jars. Watch them band together!`,
                explain: `${n}${L} is ${Array(n).fill(L).join(" + ")} — multiplication is repeated addition.`
            };
        }

        function gNegConst(used) {
            const L = newLetter(used);
            const n = randInt(2, 6);
            const c = randInt(2, 9);
            return {
                type: "pack",
                tag: "take-back",
                terms: [{ kind: "var", letter: L, count: n, side: "give" }, { kind: "const", count: c, side: "take" }],
                slipExpr: true,
                coach: `A minus means <strong>take back</strong> — that pile sits on the TAKE BACK side.`,
                explain: `The sign in front belongs to the term: ${MINUS}${c} is a take-back pile of ${c}.`
            };
        }

        function gNegCoef(used) {
            const L = newLetter(used);
            const n = randInt(2, 5);
            const c = randInt(2, 9);
            return {
                type: "pack",
                tag: "take-back jars",
                terms: [{ kind: "const", count: c, side: "give" }, { kind: "var", letter: L, count: n, side: "take" }],
                slipExpr: true,
                coach: `Whole jars can be taken back too! The term ${MINUS}${n}${L} is ${n} jars of ${L} on TAKE BACK.`,
                explain: `The term is ${MINUS}${n}${L}, not ${n}${L} — the sign travels with its term.`
            };
        }

        function gTwoVar(used) {
            const L1 = newLetter(used);
            const L2 = newLetter(used.concat([L1]));
            const n1 = randInt(2, 4);
            const n2 = randInt(2, 4);
            const c = randInt(2, 8);
            const withConst = Math.random() < 0.6;
            const terms = [
                { kind: "var", letter: L1, count: n1, side: "give" },
                { kind: "var", letter: L2, count: n2, side: "give" }
            ];
            if (withConst) terms.push({ kind: "const", count: c, side: "take" });
            return {
                type: "pack",
                tag: "big order",
                terms,
                slipExpr: true,
                coach: `Two different letters — two different jars. Each term keeps its own pile.`,
                explain: `Different letters are different variables: jars of ${L1} never mix with jars of ${L2}.`
            };
        }

        function gWords(used) {
            const L = newLetter(used);
            const n = randInt(2, 8);
            const c = randInt(2, 9);
            const form = pick(["mulSub", "mulAdd", "addOnly"]);
            let words, terms;
            if (form === "mulSub") {
                words = `${numWord(n)} multiplied by ${L}, subtract ${numWord(c)}`;
                terms = [{ kind: "var", letter: L, count: n, side: "give" }, { kind: "const", count: c, side: "take" }];
            } else if (form === "mulAdd") {
                words = `${numWord(n)} multiplied by ${L}, add ${numWord(c)}`;
                terms = [{ kind: "var", letter: L, count: n, side: "give" }, { kind: "const", count: c, side: "give" }];
            } else {
                words = `${L} add ${numWord(c)}`;
                terms = [{ kind: "var", letter: L, count: 1, side: "give" }, { kind: "const", count: c, side: "give" }];
            }
            return {
                type: "pack",
                tag: "words only",
                terms,
                slipExpr: false,
                slipStory: `“${words.charAt(0).toUpperCase() + words.slice(1)}.”`,
                coach: `No symbols this time — read the words and pack what they say.`,
                explain: `“${words}” builds ${form === "addOnly" ? L + " + " + c : (form === "mulAdd" ? n + L + " + " + c : n + L + " " + MINUS + " " + c)}.`
            };
        }

        const STORY_POOL = [
            (used) => {
                const L = newLetter(used);
                const n = randInt(3, 8);
                return {
                    story: `A paper bag holds ${L} tamarind balls — nobody counted them. Mr Ali wants ${n} full bags. Pack the total.`,
                    terms: [{ kind: "var", letter: L, count: n, side: "give" }],
                    explain: `${n} bags of ${L} each is ${n} × ${L}, written ${n}${L} — we leave out the × sign.`
                };
            },
            (used) => {
                const L = "s";
                const c = randInt(6, 12);
                return {
                    story: `Nadia starts with ${c} sweets in her pocket. She shares out ${L} of them — nobody knows how many yet. Pack what is left.`,
                    terms: [{ kind: "const", count: c, side: "give" }, { kind: "var", letter: L, count: 1, side: "take" }],
                    explain: `The known ${c} comes first, and the unknown ${L} is taken away: ${c} ${MINUS} ${L}, never ${L} ${MINUS} ${c}.`
                };
            },
            (used) => {
                const L = newLetter(used);
                const n = randInt(2, 4);
                const c = randInt(1, 4);
                return {
                    story: `Every party pack gets ${n} scoops of ${L} press sweets, plus ${c} free paradise plum${c === 1 ? "" : "s"} on top. Pack one party pack.`,
                    terms: [{ kind: "var", letter: L, count: n, side: "give" }, { kind: "const", count: c, side: "give" }],
                    explain: `${n} scoops of the unknown ${L} plus ${c} known extras: ${n}${L} + ${c}.`
                };
            },
            (used) => {
                const L = "d";
                const c = randInt(3, 9);
                return {
                    story: `A snack costs ${c} dollars and Kieron also wants a drink priced ${L} dollars — the price tag fell off. Pack the total cost.`,
                    terms: [{ kind: "const", count: c, side: "give" }, { kind: "var", letter: L, count: 1, side: "give" }],
                    explain: `${c} + ${L}. And remember: ${L} stands for a number, not for the word “drink”.`
                };
            }
        ];

        function gStory(used) {
            const s = pick(STORY_POOL)(used);
            return {
                type: "pack",
                tag: "real order",
                terms: s.terms,
                slipExpr: false,
                slipStory: s.story,
                coach: `Turn the story into a pack — choose jars for unknowns, sweets for knowns.`,
                explain: s.explain
            };
        }

        function gFixSign(used) {
            const L1 = newLetter(used);
            const L2 = newLetter(used.concat([L1]));
            const n1 = randInt(2, 8);
            const n2 = randInt(2, 5);
            return {
                type: "fix",
                tag: "fix the order",
                terms: [{ kind: "var", letter: L1, count: n1, side: "give" }, { kind: "var", letter: L2, count: n2, side: "take" }],
                prepack: [{ kind: "var", letter: L1, count: n1, side: "give" }, { kind: "var", letter: L2, count: n2, side: "give" }],
                slipExpr: true,
                coach: `Maya packed this order for ${exprHtml([{ kind: "var", letter: L1, count: n1, side: "give" }, { kind: "var", letter: L2, count: n2, side: "take" }])} — but she dropped a sign! Tap wrong items off and re-pack.`,
                explain: `The sign belongs to the term: the terms are ${n1}${L1} and ${MINUS}${n2}${L2}, not ${n2}${L2}.`
            };
        }

        function gFixOrder(used) {
            const L = "p";
            const c = randInt(9, 14);
            return {
                type: "fix",
                tag: "fix the order",
                terms: [{ kind: "const", count: c, side: "give" }, { kind: "var", letter: L, count: 1, side: "take" }],
                prepack: [{ kind: "var", letter: L, count: 1, side: "give" }, { kind: "const", count: c, side: "take" }],
                slipExpr: false,
                slipStory: `A maxi leaves the stand with ${c} passengers and ${L} of them get off along the way. The trainee packed it backwards — fix it so the counter shows the passengers remaining.`,
                coach: `Order matters! Start with the known ${c}, take away the unknown ${L}.`,
                explain: `${c} ${MINUS} ${L} starts with ${c} and takes ${L} away. ${L} ${MINUS} ${c} would start with the unknown — a different phrase.`
            };
        }

        function makeHatchSlip(kind, used) {
            if (kind === "num") {
                const a = randInt(3, 15), b = randInt(2, 9);
                const op = pick([" + ", " " + MINUS + " ", " × "]);
                return { text: `${a}${op}${b}`, kind: "num" };
            }
            if (kind === "alg") {
                const L = newLetter(used);
                const form = pick(["nl+c", "l-c", "l/2", "c+l"]);
                const n = randInt(2, 7), c = randInt(2, 9);
                if (form === "nl+c") return { text: `${n}${L} + ${c}`, kind: "alg" };
                if (form === "l-c") return { text: `${n}${L} ${MINUS} ${c}`, kind: "alg" };
                if (form === "l/2") return { text: `${L} ÷ 2`, kind: "alg" };
                return { text: `${c} + ${L}`, kind: "alg" };
            }
            const L = newLetter(used);
            const n = randInt(2, 6), c = randInt(6, 24);
            return { text: `${n}${L} = ${c}`, kind: "eq" };
        }

        function gHatch(used) {
            const slips = shuffle([
                makeHatchSlip("num", used),
                makeHatchSlip("alg", used),
                makeHatchSlip("alg", used),
                makeHatchSlip("eq", used)
            ]);
            return {
                type: "hatch",
                tag: "sort the post",
                slips,
                coach: `Morning post! Slide each slip to its tray. Only numbers? <strong>Numerical.</strong> Has a letter? <strong>Algebraic.</strong> Has an equals sign? <strong>Equation</strong> — a claim, not an order.`,
                explain: `An expression has no equals sign. A letter makes it algebraic; only numbers makes it numerical.`
            };
        }

        /* ---------- run assembly ---------- */
        function freshRun() {
            const used = [];
            const mk = (fn) => {
                const r = fn(used);
                (r.terms || []).forEach((t) => { if (t.kind === "var") used.push(t.letter); });
                return r;
            };
            const negFns = shuffle([gNegConst, gNegCoef]);
            const fixFn = pick([gFixSign, gFixOrder]);
            const lastFn = pick([gTwoVar, negFns[1]]);
            const drawn = [
                mk(gVarIntro),
                mk(gCoef),
                mk(gHatch),
                mk(negFns[0]),
                mk(fixFn),
                mk(gStory),
                mk(gWords),
                mk(lastFn)
            ];
            return { drawn, roundIdx: 0, results: [], done: false };
        }

        let run = null;
        let round = null;   /* live round state, not persisted */
        let fDom = null;    /* per-render element refs */
        let timers = [];

        function later(fn, ms) {
            timers.push(setTimeout(fn, ms));
        }

        function clearTimers() {
            timers.forEach((t) => clearTimeout(t));
            timers = [];
        }

        function saveRun() {
            storageSet(SAVE_KEY(), JSON.stringify(run));
        }

        function loadRun() {
            const raw = storageGet(SAVE_KEY());
            if (!raw) return null;
            try {
                const r = JSON.parse(raw);
                if (r && Array.isArray(r.drawn) && r.drawn.length === ROUNDS_PER_RUN) return r;
            } catch (err) { /* corrupt save */ }
            return null;
        }

        /* ---------- shell render ---------- */
        function renderSimShell() {
            dom.simContainer.innerHTML = `
                <div class="round-head">
                    <div class="round-label" id="roundLabel"></div>
                    <div class="spike-row" id="spikeRow" role="img" aria-label="Order slips completed"></div>
                    <div class="round-tools">
                        <button class="control-btn" id="hintBtn" aria-label="Get a hint for this order">💡 Hint</button>
                        <button class="control-btn" id="reviewBtn" aria-label="Review your orders">📖 Review</button>
                    </div>
                </div>
                <div class="coach-row">
                    <span class="coach-till" id="coachTill" aria-hidden="true">${tillSvg(44)}</span>
                    <div class="coach-bubble" id="coachLine" role="status" aria-live="polite"></div>
                </div>
                <div id="roundArea"></div>
                <span class="rev-note" aria-hidden="true"></span>`;
            document.querySelectorAll("#simContainer .rev-note").forEach((el) => { if (!el.textContent) el.textContent = BUILD_META; });
            fDom = {
                roundLabel: document.getElementById("roundLabel"),
                spikeRow: document.getElementById("spikeRow"),
                coachTill: document.getElementById("coachTill"),
                coachLine: document.getElementById("coachLine"),
                roundArea: document.getElementById("roundArea"),
                hintBtn: document.getElementById("hintBtn")
            };
            fDom.hintBtn.addEventListener("click", giveHint);
            document.getElementById("reviewBtn").addEventListener("click", openReviewModal);
            renderSpike();
        }

        function renderSpike() {
            fDom.spikeRow.replaceChildren();
            for (let i = 0; i < ROUNDS_PER_RUN; i++) {
                const s = document.createElement("span");
                s.className = "spike-slip";
                const res = run.results[i];
                if (res) {
                    s.classList.add(res.grade);
                    s.textContent = res.grade === "gold" ? "★" : res.grade === "white" ? "✓" : "·";
                } else {
                    s.textContent = "";
                }
                fDom.spikeRow.appendChild(s);
            }
            fDom.roundLabel.textContent = run.done ? "Shift done!" : `Order ${run.roundIdx + 1} of ${ROUNDS_PER_RUN}`;
        }

        function setCoach(html, ding) {
            const changed = fDom.coachLine.innerHTML !== html;
            fDom.coachLine.innerHTML = html;
            if (changed && !reducedMotion()) {
                const bubble = fDom.coachLine;
                bubble.classList.remove("speak");
                void bubble.offsetWidth;
                bubble.classList.add("speak");
            }
            if (ding && !reducedMotion()) {
                fDom.coachTill.classList.remove("ding");
                void fDom.coachTill.offsetWidth;
                fDom.coachTill.classList.add("ding");
            }
        }

        function setCue(el) {
            document.querySelectorAll(".cue").forEach((c) => c.classList.remove("cue"));
            if (el) el.classList.add("cue");
        }

        function giveHint() {
            if (!round || round.resolved) return;
            playSound("click");
            if (round.cfg.type === "hatch") {
                setCoach("💡 Only numbers → <strong>Numerical</strong><br>🫙 Has a letter → <strong>Algebraic</strong><br>⚖️ Has = → <strong>Equation</strong>", true);
                return;
            }
            if (statesMatch(round.counter, round.cfg)) {
                setCoach("💡 Your counter matches the slip — ring the stamp!", true);
                return;
            }
            setCoach("💡 " + escapeHtml(diffFeedback(round.counter, round.cfg)), true);
        }

        /* ---------- round flow ---------- */
        function startRound() {
            clearTimers();
            dom.fxLayer.replaceChildren();
            const cfg = run.drawn[run.roundIdx];
            round = {
                cfg,
                tries: 0,
                counter: freshCounter(),
                resolved: false,
                hatchIdx: 0,
                hatchMisses: 0,
                selSupply: null,
                selSlip: false
            };
            if (cfg.type === "hatch") {
                renderHatchRound();
            } else {
                renderPackRound();
            }
            renderSpike();
        }

        function slipInner(cfg) {
            if (cfg.slipExpr) {
                return `<div class="slip-head">Order slip</div><div class="slip-expr">${exprHtml(cfg.terms)}</div>`;
            }
            return `<div class="slip-head">Order slip</div><div class="slip-story">${cfg.slipStory}</div>`;
        }

        function renderPackRound() {
            const cfg = round.cfg;
            fDom.roundArea.innerHTML = `
                <div class="play-flow">
                    <div class="brief-row">
                        <div class="order-slip" id="orderSlip">${slipInner(cfg)}</div>
                        <div class="brief-side">
                            <div class="readout-well" id="readoutWell"></div>
                            <div class="feedback-well" id="feedbackWell" role="status" aria-live="polite"></div>
                        </div>
                    </div>
                    <div class="counter-sides">
                        <div class="side-zone give" id="giveZone" data-side="give" tabindex="0" role="button" aria-label="Give side of the counter — items here add. Select a supply first, then press Enter here to place it">
                            <span class="side-tag">Give +</span>
                            <div class="zone-items" id="giveItems"></div>
                        </div>
                        <div class="side-zone take" id="takeZone" data-side="take" tabindex="0" role="button" aria-label="Take back side of the counter — items here subtract. Select a supply first, then press Enter here to place it">
                            <span class="side-tag">Take back ${MINUS}</span>
                            <div class="zone-items" id="takeItems"></div>
                        </div>
                    </div>
                    <div class="supply-bar" id="supplyBar"><span class="shelf-cap" aria-hidden="true">The shelf — drag or tap onto the counter</span></div>
                    <div class="stamp-bar">
                        <button class="secondary-btn" id="unpackBtn">Unpack all</button>
                        <button class="primary-btn" id="stampBtn" disabled>🔔 Stamp the order</button>
                    </div>
                </div>`;
            const slipEl = document.getElementById("orderSlip");
            appendStow(slipEl.querySelector(".slip-expr") || slipEl.querySelector(".slip-story"));

            /* supplies: jars for every letter this round needs, plus loose sweets */
            const letters = [...new Set(cfg.terms.filter((t) => t.kind === "var").map((t) => t.letter))];
            const bar = document.getElementById("supplyBar");
            letters.forEach((L) => {
                const b = document.createElement("button");
                b.className = "supply-item";
                b.dataset.kind = "var";
                b.dataset.letter = L;
                b.setAttribute("aria-label", `Jar of ${L} — drag or tap, then tap a counter side`);
                b.innerHTML = jarSvg(L) + `<span class="supply-cap">jar of ${L}</span>`;
                bar.appendChild(b);
            });
            const sw = document.createElement("button");
            sw.className = "supply-item";
            sw.dataset.kind = "const";
            sw.setAttribute("aria-label", "Loose sweet — drag or tap, then tap a counter side");
            sw.innerHTML = sweetSvg(SWEET_COLS[0]) + `<span class="supply-cap">loose sweet</span>`;
            bar.appendChild(sw);

            bindPackEvents();

            /* fix rounds arrive pre-packed wrong */
            if (cfg.type === "fix" && cfg.prepack) {
                cfg.prepack.forEach((t) => {
                    for (let i = 0; i < t.count; i++) addToCounter(t.kind, t.letter, t.side, true);
                });
            }
            updateCounterView(true);

            setCoach(cfg.coach, true);
            setCue(cfg.type === "fix"
                ? (document.querySelector(".pack-group") || bar.querySelector(".supply-item"))
                : bar.querySelector(".supply-item"));
        }

        function bindPackEvents() {
            const bar = document.getElementById("supplyBar");
            bar.querySelectorAll(".supply-item").forEach((item) => {
                item.addEventListener("pointerdown", (e) => beginDrag(e, item));
                item.addEventListener("click", () => {
                    if (dragMoved) return;
                    round.selSupply = round.selSupply === item ? null : item;
                    bar.querySelectorAll(".supply-item").forEach((i) => i.classList.toggle("sel", i === round.selSupply));
                    document.querySelectorAll(".side-zone").forEach((z) => z.classList.toggle("sel-target", !!round.selSupply));
                    if (round.selSupply) {
                        setCoach("Now tap a counter side to place it.", false);
                        playSound("click");
                    }
                });
                item.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        item.click();
                    }
                });
            });
            document.querySelectorAll(".side-zone").forEach((zone) => {
                zone.addEventListener("click", (e) => {
                    if (e.target.closest(".pack-group")) return;
                    if (round.selSupply && !round.resolved) {
                        addToCounter(round.selSupply.dataset.kind, round.selSupply.dataset.letter, zone.dataset.side);
                        updateCounterView();
                    }
                });
                zone.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        zone.click();
                    }
                });
            });
            document.getElementById("stampBtn").addEventListener("click", stampOrder);
            document.getElementById("unpackBtn").addEventListener("click", () => {
                if (round.resolved) return;
                round.counter = freshCounter();
                updateCounterView();
                playSound("click");
            });
        }

        /* pointer drag with full-fidelity ghost */
        let dragMoved = false;
        function beginDrag(e, item) {
            if (round.resolved) return;
            if (e.pointerType === "mouse" && e.button !== 0) return;
            dragMoved = false;
            const startX = e.clientX, startY = e.clientY;
            let ghost = null;
            const onMove = (ev) => {
                if (!dragMoved && Math.hypot(ev.clientX - startX, ev.clientY - startY) < 6) return;
                if (!ghost) {
                    dragMoved = true;
                    ghost = document.createElement("div");
                    ghost.className = "drag-ghost";
                    ghost.innerHTML = item.dataset.kind === "var" ? jarSvg(item.dataset.letter) : sweetSvg(SWEET_COLS[0]);
                    document.body.appendChild(ghost);
                }
                ghost.style.left = ev.clientX + "px";
                ghost.style.top = ev.clientY + "px";
                document.querySelectorAll(".side-zone").forEach((z) => {
                    const r = z.getBoundingClientRect();
                    z.classList.toggle("drop-hot", ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom);
                });
            };
            const onUp = (ev) => {
                document.removeEventListener("pointermove", onMove);
                document.removeEventListener("pointerup", onUp);
                if (ghost) ghost.remove();
                const hot = document.querySelector(".side-zone.drop-hot");
                document.querySelectorAll(".side-zone").forEach((z) => z.classList.remove("drop-hot"));
                if (dragMoved && hot && !round.resolved) {
                    addToCounter(item.dataset.kind, item.dataset.letter, hot.dataset.side);
                    updateCounterView();
                }
                later(() => { dragMoved = false; }, 50);
            };
            document.addEventListener("pointermove", onMove);
            document.addEventListener("pointerup", onUp);
        }

        function addToCounter(kind, letter, side, silent) {
            const c = round.counter;
            if (kind === "var") {
                const prev = c[side].vars[letter] || 0;
                c[side].vars[letter] = prev + 1;
                if (!c.order.find((o) => o.kind === "var" && o.letter === letter && o.side === side)) {
                    c.order.push({ kind: "var", letter, side });
                }
                if (!silent) {
                    playSound(prev + 1 >= 2 ? "band" : "pack");
                    round.justBanded = prev + 1 >= 2 ? letter + side : null;
                }
            } else {
                c[side].loose += 1;
                if (!c.order.find((o) => o.kind === "const" && o.side === side)) {
                    c.order.push({ kind: "const", side });
                }
                if (!silent) playSound("pack");
            }
        }

        function removeFromCounter(kind, letter, side) {
            const c = round.counter;
            if (kind === "var") {
                const n = c[side].vars[letter] || 0;
                if (n > 0) c[side].vars[letter] = n - 1;
                if (c[side].vars[letter] === 0) {
                    delete c[side].vars[letter];
                    c.order = c.order.filter((o) => !(o.kind === "var" && o.letter === letter && o.side === side));
                }
            } else {
                if (c[side].loose > 0) c[side].loose -= 1;
                if (c[side].loose === 0) {
                    c.order = c.order.filter((o) => !(o.kind === "const" && o.side === side));
                }
            }
            playSound("click");
        }

        function updateCounterView(silent) {
            const c = round.counter;
            ["give", "take"].forEach((side) => {
                const holder = document.getElementById(side + "Items");
                holder.replaceChildren();
                c.order.filter((o) => o.side === side).forEach((o) => {
                    if (o.kind === "var") {
                        const n = c[side].vars[o.letter] || 0;
                        if (!n) return;
                        const g = document.createElement("button");
                        g.className = "pack-group";
                        g.setAttribute("aria-label", `${n} jar${n === 1 ? "" : "s"} of ${o.letter} on the ${side === "give" ? "give" : "take back"} side — tap to take one off`);
                        const shown = Math.min(n, 4);
                        let jars = "";
                        for (let i = 0; i < shown; i++) jars += jarSvg(o.letter);
                        const bandTxt = (side === "take" ? MINUS : "") + (n === 1 ? o.letter : n + o.letter);
                        const flash = round.justBanded === o.letter + side && !silent;
                        g.innerHTML = `<div class="jars">${jars}</div><span class="band-label${flash ? " flash" : ""}">${bandTxt}</span>`;
                        g.addEventListener("click", (e) => {
                            e.stopPropagation();
                            if (round.resolved) return;
                            removeFromCounter("var", o.letter, side);
                            updateCounterView();
                        });
                        holder.appendChild(g);
                    } else {
                        const n = c[side].loose;
                        if (!n) return;
                        const g = document.createElement("button");
                        g.className = "pack-group";
                        g.setAttribute("aria-label", `${n} loose sweet${n === 1 ? "" : "s"} on the ${side === "give" ? "give" : "take back"} side — tap to take one off`);
                        const shown = Math.min(n, 8);
                        let sweets = "";
                        for (let i = 0; i < shown; i++) sweets += sweetSvg(SWEET_COLS[i % SWEET_COLS.length]);
                        g.innerHTML = `<div class="jars">${sweets}</div><span class="band-label">${(side === "take" ? MINUS : "") + n}</span>`;
                        g.addEventListener("click", (e) => {
                            e.stopPropagation();
                            if (round.resolved) return;
                            removeFromCounter("const", null, side);
                            updateCounterView();
                        });
                        holder.appendChild(g);
                    }
                });
            });
            round.justBanded = null;

            /* live readout — the sim visibly teaches */
            const terms = counterTerms(c);
            const well = document.getElementById("readoutWell");
            if (terms.length) {
                well.innerHTML = `<div class="readout-title">Your counter says</div>
                    <div class="readout-expr">${exprHtml(terms)}</div>
                    <div class="readout-words">${exprWords(terms)}</div>`;
            } else {
                well.innerHTML = `<div class="readout-title">Your counter says</div>
                    <div class="readout-expr placeholder">nothing yet — pack the counter below</div>`;
            }

            const stamp = document.getElementById("stampBtn");
            stamp.disabled = terms.length === 0 || round.resolved;
            if (!round.resolved) {
                setCue(terms.length ? stamp : document.querySelector("#supplyBar .supply-item"));
            }

            /* deselect supply after placement */
            if (round.selSupply) {
                round.selSupply.classList.remove("sel");
                round.selSupply = null;
                document.querySelectorAll(".side-zone").forEach((z) => z.classList.remove("sel-target"));
            }
        }

        function stampOrder() {
            if (round.resolved) return;
            const cfg = round.cfg;
            const fb = document.getElementById("feedbackWell");
            if (statesMatch(round.counter, cfg)) {
                round.resolved = true;
                const grade = round.tries === 0 ? "gold" : "white";
                fb.className = "feedback-well good";
                fb.textContent = grade === "gold" ? "Perfect pack, first try! Order stamped." : "Order stamped — well fixed!";
                playSound("correct");
                wrapperShower(grade === "gold");
                finishRound(grade);
            } else {
                round.tries += 1;
                fb.className = "feedback-well bad";
                const hint = diffFeedback(round.counter, cfg);
                if (round.tries === 1) {
                    fb.textContent = hint;
                    setCoach(`Not yet — <strong>try again.</strong> ${escapeHtml(hint)}`, false);
                    playSound("wrong");
                    peaSpill();
                } else {
                    fb.textContent = "Watch — the counter packs itself.";
                    playSound("wrong");
                    peaSpill();
                    round.resolved = true;
                    later(() => revealPack(), 700);
                }
            }
        }

        function revealPack() {
            const cfg = round.cfg;
            round.counter = freshCounter();
            cfg.terms.forEach((t) => {
                for (let i = 0; i < t.count; i++) addToCounter(t.kind, t.letter, t.side, true);
            });
            updateCounterView(true);
            const fb = document.getElementById("feedbackWell");
            fb.className = "feedback-well bad";
            fb.textContent = cfg.explain;
            setCoach(escapeHtml(cfg.explain), true);
            finishRound("crumpled");
        }

        function finishRound(grade) {
            setCue(null);
            const isHatch = round.cfg.type === "hatch";
            const kindName = (k) => k === "num" ? "numerical" : k === "alg" ? "algebraic" : "equation";
            run.results[run.roundIdx] = {
                grade,
                slip: isHatch
                    ? round.cfg.slips.map((s) => s.text).join(", ")
                    : round.cfg.slipExpr ? exprHtml(round.cfg.terms).replace(/<[^>]+>/g, "") : (round.cfg.slipStory || "").replace(/<[^>]+>/g, ""),
                answer: isHatch
                    ? round.cfg.slips.map((s) => `${s.text} → ${kindName(s.kind)}`).join("; ")
                    : exprHtml(round.cfg.terms).replace(/<[^>]+>/g, ""),
                explain: round.cfg.explain,
                tag: round.cfg.tag
            };
            renderSpike();
            if (!round.cfg.explain || grade === "crumpled") {
                /* explanation already shown for crumpled */
            } else if (grade !== "gold") {
                setCoach(escapeHtml(round.cfg.explain), false);
            }
            const nextIsEnd = run.roundIdx + 1 >= ROUNDS_PER_RUN;
            later(() => {
                const bar = document.querySelector(".stamp-bar") || document.querySelector(".hatch-desk");
                if (!bar) return;
                const nextBtn = document.createElement("button");
                nextBtn.className = "primary-btn";
                nextBtn.id = "nextBtn";
                nextBtn.textContent = nextIsEnd ? "Count the till" : "Next order";
                nextBtn.addEventListener("click", advanceRound, { once: true });
                const stamp = document.getElementById("stampBtn");
                if (stamp) stamp.classList.add("hidden");
                const unpack = document.getElementById("unpackBtn");
                if (unpack) unpack.classList.add("hidden");
                bar.appendChild(nextBtn);
                setCue(nextBtn);
            }, grade === "crumpled" ? 1200 : 900);
        }

        function advanceRound() {
            run.roundIdx += 1;
            saveRun();   /* persist on EVERY index advance */
            if (run.roundIdx >= ROUNDS_PER_RUN) {
                run.done = true;
                saveRun();
                renderEndScreen();
            } else {
                startRound();
            }
        }

        /* ---------- hatch rounds ---------- */
        const TRAYS = [
            { id: "num", title: "Numerical expression", cap: "only numbers — you could count it now" },
            { id: "alg", title: "Algebraic expression", cap: "has a letter — a jar nobody counted" },
            { id: "eq", title: "Equation", cap: "has = — a claim, not an order" }
        ];

        function renderHatchRound() {
            const cfg = round.cfg;
            fDom.roundArea.innerHTML = `
                <div class="feedback-well" id="feedbackWell" role="status" aria-live="polite"></div>
                <div class="hatch-grid">
                    ${TRAYS.map((t) => `
                        <div class="hatch-tray" id="tray-${t.id}" data-tray="${t.id}" tabindex="0" role="button" aria-label="${t.title} tray — ${t.cap}. Select the slip first, then press Enter here to file it">
                            <h4>${t.title}</h4>
                            <div class="tray-cap">${t.cap}</div>
                            <div class="tray-slips" id="traySlips-${t.id}"></div>
                        </div>`).join("")}
                </div>
                <div class="hatch-desk" id="hatchDesk"></div>`;
            document.querySelectorAll(".hatch-tray").forEach((tray) => {
                tray.addEventListener("click", () => {
                    if (round.selSlip && !round.resolved) {
                        placeHatchSlip(tray.dataset.tray);
                    }
                });
                tray.addEventListener("keydown", (e) => {
                    if (e.key === "Enter" || e.key === " ") {
                        e.preventDefault();
                        tray.click();
                    }
                });
            });
            setCoach(cfg.coach, true);
            nextHatchSlip();
        }

        function nextHatchSlip() {
            const desk = document.getElementById("hatchDesk");
            desk.replaceChildren();
            round.selSlip = false;
            if (round.hatchIdx >= round.cfg.slips.length) {
                const grade = round.hatchMisses === 0 ? "gold" : (round.hatchMisses <= 2 ? "white" : "crumpled");
                round.resolved = true;
                const fb = document.getElementById("feedbackWell");
                fb.className = "feedback-well " + (grade === "crumpled" ? "bad" : "good");
                fb.textContent = grade === "gold" ? "Post sorted, no slips wasted!" : grade === "white" ? "Post sorted!" : "Post sorted — read each tray's rule again.";
                if (grade === "crumpled") { playSound("wrong"); peaSpill(); }
                else { playSound("correct"); wrapperShower(grade === "gold"); }
                setCoach(escapeHtml(round.cfg.explain), true);
                finishRound(grade);
                return;
            }
            const slip = round.cfg.slips[round.hatchIdx];
            const b = document.createElement("button");
            b.className = "mini-slip";
            b.id = "deskSlip";
            b.textContent = slip.text;
            b.setAttribute("aria-label", `Slip reading ${slip.text} — drag it, or press Enter then choose a tray`);
            b.addEventListener("pointerdown", (e) => beginHatchDrag(e, b));
            b.addEventListener("click", () => {
                if (dragMoved || round.resolved) return;
                round.selSlip = !round.selSlip;
                b.classList.toggle("sel", round.selSlip);
                document.querySelectorAll(".hatch-tray").forEach((t) => t.classList.toggle("sel-target", round.selSlip));
                if (round.selSlip) playSound("click");
            });
            b.addEventListener("keydown", (e) => {
                if (e.key === "Enter" || e.key === " ") {
                    e.preventDefault();
                    b.click();
                }
            });
            desk.appendChild(b);
            appendStow(desk);
            setCue(b);
        }

        function beginHatchDrag(e, slipEl) {
            if (round.resolved) return;
            if (e.pointerType === "mouse" && e.button !== 0) return;
            dragMoved = false;
            const startX = e.clientX, startY = e.clientY;
            let ghost = null;
            const onMove = (ev) => {
                if (!dragMoved && Math.hypot(ev.clientX - startX, ev.clientY - startY) < 6) return;
                if (!ghost) {
                    dragMoved = true;
                    ghost = document.createElement("div");
                    ghost.className = "drag-ghost mini-slip";
                    ghost.textContent = slipEl.textContent;
                    document.body.appendChild(ghost);
                    slipEl.style.visibility = "hidden";
                }
                ghost.style.left = ev.clientX + "px";
                ghost.style.top = ev.clientY + "px";
                document.querySelectorAll(".hatch-tray").forEach((z) => {
                    const r = z.getBoundingClientRect();
                    z.classList.toggle("drop-hot", ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom);
                });
            };
            const onUp = () => {
                document.removeEventListener("pointermove", onMove);
                document.removeEventListener("pointerup", onUp);
                if (ghost) ghost.remove();
                slipEl.style.visibility = "";
                const hot = document.querySelector(".hatch-tray.drop-hot");
                document.querySelectorAll(".hatch-tray").forEach((z) => z.classList.remove("drop-hot"));
                if (dragMoved && hot && !round.resolved) {
                    placeHatchSlip(hot.dataset.tray);
                }
                later(() => { dragMoved = false; }, 50);
            };
            document.addEventListener("pointermove", onMove);
            document.addEventListener("pointerup", onUp);
        }

        function placeHatchSlip(trayId) {
            const slip = round.cfg.slips[round.hatchIdx];
            const desk = document.getElementById("deskSlip");
            const fb = document.getElementById("feedbackWell");
            document.querySelectorAll(".hatch-tray").forEach((t) => t.classList.remove("sel-target"));
            round.selSlip = false;
            if (desk) desk.classList.remove("sel");
            if (desk && desk.disabled) return;
            if (trayId === slip.kind) {
                if (desk) desk.disabled = true;
                const holder = document.getElementById("traySlips-" + trayId);
                const s = document.createElement("span");
                s.className = "mini-slip settled";
                s.textContent = slip.text;
                holder.appendChild(s);
                fb.className = "feedback-well good";
                fb.textContent = slip.kind === "eq"
                    ? "Right — the equals sign makes it an equation."
                    : slip.kind === "alg"
                        ? "Right — the letter makes it algebraic."
                        : "Right — only numbers, countable now.";
                playSound("correct");
                round.hatchIdx += 1;
                later(nextHatchSlip, 500);
            } else {
                round.hatchMisses += 1;
                fb.className = "feedback-well bad";
                fb.textContent = slip.kind === "eq"
                    ? "Look again — it has an equals sign."
                    : slip.kind === "alg"
                        ? "Look again — there is a letter hiding in it."
                        : "Look again — it is only numbers.";
                playSound("wrong");
                if (desk && !reducedMotion()) {
                    desk.classList.remove("wobble");
                    void desk.offsetWidth;
                    desk.classList.add("wobble");
                }
                if (round.hatchMisses >= 4) {
                    /* auto-place after repeated misses so nobody is stuck */
                    if (desk) desk.disabled = true;
                    const holder = document.getElementById("traySlips-" + slip.kind);
                    const s = document.createElement("span");
                    s.className = "mini-slip settled";
                    s.textContent = slip.text;
                    holder.appendChild(s);
                    round.hatchIdx += 1;
                    later(nextHatchSlip, 700);
                }
            }
        }

        /* ---------- end screen ---------- */
        function renderEndScreen() {
            clearTimers();
            setCue(null);
            const gold = run.results.filter((r) => r && r.grade === "gold").length;
            const white = run.results.filter((r) => r && r.grade === "white").length;
            fDom.roundArea.innerHTML = `
                <div class="end-wrap">
                    <h3>Shop shut — till counted!</h3>
                    <p class="end-rule">An algebraic expression is a maths phrase built from numbers, letters and operation signs — with <strong>no equals sign</strong>. The letter is a variable, the number in front counts its jars, and the sign in front of a term always belongs to that term.</p>
                    <div class="end-spike" id="endSpike"></div>
                    <div class="end-legend">★ first-try stamp · ✓ stamped after a retry · dashed = the counter had to show you</div>
                    <p class="end-rule">${gold === ROUNDS_PER_RUN ? "Every order perfect on the first try — parlour legend!" : `${gold + white} of ${ROUNDS_PER_RUN} orders stamped${gold ? `, ${gold} on the first try` : ""}.`}</p>
                    <div class="button-row">
                        <button class="secondary-btn" id="endReviewBtn">📖 Review orders</button>
                        <button class="primary-btn" id="playAgainBtn">Play again</button>
                    </div>
                </div>`;
            const spike = document.getElementById("endSpike");
            run.results.forEach((r) => {
                const s = document.createElement("span");
                s.className = "spike-slip " + r.grade;
                s.textContent = r.grade === "gold" ? "★" : r.grade === "white" ? "✓" : "·";
                spike.appendChild(s);
            });
            fDom.roundLabel.textContent = "Shift done!";
            /* end card owns its summary and its Review — hide the duplicate header strip and tools */
            fDom.spikeRow.classList.add("hidden");
            fDom.hintBtn.classList.add("hidden");
            document.getElementById("reviewBtn").classList.add("hidden");
            setCoach("Great shift! Review your order book, or start a fresh one.", true);
            document.getElementById("endReviewBtn").addEventListener("click", openReviewModal);
            document.getElementById("playAgainBtn").addEventListener("click", () => {
                run = freshRun();
                saveRun();
                devInit(true);
            });
            playSound("complete");
        }

        /* ---------- review modal ---------- */
        function openReviewModal() {
            const body = dom.reviewBody;
            body.replaceChildren();
            const recs = (run ? run.results : []).filter(Boolean);
            if (!recs.length) {
                const p = document.createElement("p");
                p.textContent = "No orders stamped yet — finish an order first.";
                body.appendChild(p);
            } else {
                const list = document.createElement("div");
                list.className = "review-list";
                recs.forEach((r, i) => {
                    const item = document.createElement("div");
                    item.className = "review-item";
                    const icon = document.createElement("span");
                    icon.className = "rv-icon";
                    icon.textContent = r.grade === "gold" ? "★" : r.grade === "white" ? "✓" : "✗";
                    const copy = document.createElement("div");
                    copy.className = "rv-copy";
                    const strong = document.createElement("strong");
                    strong.textContent = `Order ${i + 1} (${r.tag}): ${r.answer}`;
                    const span = document.createElement("span");
                    span.textContent = r.explain;
                    copy.appendChild(strong);
                    copy.appendChild(span);
                    item.appendChild(icon);
                    item.appendChild(copy);
                    list.appendChild(item);
                });
                body.appendChild(list);
            }
            dom.reviewModal.classList.add("show");
            resetModalScroll(dom.reviewModal);
        }

        function closeReviewModal() {
            dom.reviewModal.classList.remove("show");
        }

        /* ---------- fx: wrapper shower / pea spill ---------- */
        function wrapperShower(big) {
            if (reducedMotion()) return;
            const n = big ? 16 : 8;
            const w = window.innerWidth;
            for (let i = 0; i < n; i++) {
                const f = document.createElement("div");
                f.className = "wrapper-bit";
                f.style.left = randInt(Math.round(w * 0.1), Math.round(w * 0.9)) + "px";
                f.style.setProperty("--dur", (randInt(1600, 2500) / 1000) + "s");
                f.style.setProperty("--fall", (window.innerHeight + 120) + "px");
                f.style.setProperty("--spin", randInt(-160, 160) + "deg");
                const inner = document.createElement("span");
                inner.className = "wrapper-inner";
                inner.style.setProperty("--sway", randInt(20, 60) + "px");
                inner.style.setProperty("--sway-dur", (randInt(450, 850) / 1000) + "s");
                const col = pick(SWEET_COLS);
                inner.innerHTML = Math.random() < 0.5
                    ? sweetSvg(col, "26px")
                    : `<svg width="30" height="16" viewBox="0 0 30 16">${SVG_DESC}<path d="M4 8 L0 2 L4 5 L3 1 Z" fill="${col}"/><path d="M26 8 L30 2 L26 5 L27 1 Z" fill="${col}"/><rect x="4" y="3" width="22" height="10" rx="4" fill="${col}" opacity="0.85"/><rect x="8" y="3" width="3" height="10" fill="rgba(255,255,255,0.35)"/></svg>`;
                f.appendChild(inner);
                dom.fxLayer.appendChild(f);
                later(() => f.remove(), 2700);
            }
        }

        function peaSpill() {
            if (!reducedMotion()) {
                const w = window.innerWidth;
                const cx = w / 2;
                for (let i = 0; i < 12; i++) {
                    const p = document.createElement("div");
                    p.className = "pea-puff";
                    const sz = randInt(8, 18);
                    p.style.width = sz + "px";
                    p.style.height = sz + "px";
                    p.style.left = (cx + randInt(-160, 160)) + "px";
                    p.style.background = pick(["#7a8a3c", "#5f6e2c", "#8a7a3c", "#6d5c2c"]);
                    p.style.setProperty("--dx", randInt(-150, 150) + "px");
                    p.style.setProperty("--dy", -randInt(40, 150) + "px");
                    p.style.setProperty("--dur", (randInt(450, 750) / 1000) + "s");
                    dom.fxLayer.appendChild(p);
                    later(() => p.remove(), 850);
                }
                /* rumble the shell, NOT body — body transform breaks fixed layers */
                const shell = dom.appShell;
                shell.classList.remove("page-rumble");
                void shell.offsetWidth;
                shell.classList.add("page-rumble");
                later(() => shell.classList.remove("page-rumble"), 450);
            }
        }

        /* ---------- entry points ---------- */
        function devInit(isReplay) {
            if (!run) run = loadRun();
            if (!run || run.done) run = freshRun();
            saveRun();
            renderSimShell();
            startRound();
            /* Help auto-opens on every home-screen Start (never on resume or Play again) */
            if (!isReplay) {
                openInstructionsModal();
            }
        }

        function devReset() {
            clearTimers();
            run = null;
            round = null;
            storageSet(SAVE_KEY(), "");
            dom.simContainer.replaceChildren();
        }

        initializeApp();

        /* resume mid-run on reload */
        (function resumeIfSaved() {
            const saved = loadRun();
            if (saved && !saved.done && saved.roundIdx > 0) {
                run = saved;
                showScreen("sim");
                devInit(true);
            }
        })();
    </script>
