<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Two-Sided Story</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#0f1222; --bg-soft:#171b31; --surface:#1d2340; --surface-2:#252d52;
      --text:#eef2ff; --text-soft:#c7d0f0; --soft:#c7d0f0; --muted:#98a4c8;
      --border:rgba(255,255,255,.12); --accent:#7dd3fc; --accent-2:#a78bfa;
      --teal:#2dd4bf; --coral:#fb7185; --gold:#fbbf24; --success:#34d399;
      --danger:#fb7185; --warning:#fbbf24; --shadow:0 18px 40px rgba(0,0,0,.28);
      --radius-xl:24px; --radius-lg:18px; --radius-md:12px;
      --focus:0 0 0 3px rgba(125,211,252,.35);
    }
    html[data-theme="light"] {
      color-scheme:light; --bg:#f4f7ff; --bg-soft:#e7edff; --surface:#fff;
      --surface-2:#eef3ff; --text:#17203f; --text-soft:#344267; --soft:#344267;
      --muted:#5d6b95; --border:rgba(23,32,63,.12); --accent:#0ea5e9;
      --accent-2:#7c3aed; --success:#059669; --warning:#d97706; --danger:#e11d48;
      --shadow:0 18px 40px rgba(46,64,112,.14); --focus:0 0 0 3px rgba(14,165,233,.22);
    }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; height:100%; }
    body {
      min-height:100vh; padding:16px; font:16px/1.45 Arial,Helvetica,sans-serif;
      color:var(--text);
      background:radial-gradient(circle at top right,rgba(167,139,250,.12),transparent 30%),
        radial-gradient(circle at top left,rgba(125,211,252,.12),transparent 25%),var(--bg);
      height:100vh; overflow:hidden;
    }
    button { font:inherit; border:0; border-radius:999px; cursor:pointer; min-width:44px; min-height:44px;
      padding:12px 18px; line-height:1.25; overflow-wrap:anywhere;
      transition:transform .18s ease,opacity .18s ease,background .18s ease;
      touch-action:manipulation; }
    button:hover { transform:translateY(-1px); }
    button:focus-visible { outline:none; box-shadow:var(--focus); }
    button[disabled] { opacity:.58; cursor:not-allowed; transform:none; }
    .shell { width:min(1180px,100%); height:calc(100vh - 32px); min-height:0; margin:auto;
      display:flex; flex-direction:column; gap:16px; }
    .topbar,.card,.modal-card { background:var(--surface); border:1px solid var(--border); box-shadow:var(--shadow); }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:12px 16px; border-radius:var(--radius-lg); backdrop-filter:blur(12px); }
    .brand { display:flex; align-items:center; gap:12px; min-width:0; }
    .badge { width:46px; height:46px; display:grid; place-items:center; border-radius:14px;
      background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#fff; font-weight:700; box-shadow:var(--shadow); }
    .brand h1,.brand p { margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .brand h1 { font-size:1.08rem; }
    .brand p { color:var(--muted); margin-top:2px; font-size:.92rem; }
    .chrome { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:10px; }
    .control-btn,.primary-btn,.secondary-btn,.ghost-btn,.danger-btn,.nav-btn,
    .icon-btn { border-radius:999px; padding:12px 18px; font-weight:700; display:inline-flex;
      align-items:center; justify-content:center; gap:6px; background:var(--surface-2);
      color:var(--text); border:1px solid var(--border); }
    .btn-icon { width:18px; height:18px; flex:0 0 auto; fill:none; stroke:currentColor; stroke-width:2;
      stroke-linecap:round; stroke-linejoin:round; }
    .primary,.primary-btn { background:linear-gradient(135deg,var(--accent),var(--accent-2));
      color:#fff; box-shadow:var(--shadow); font-weight:800; }
    .danger,.danger-btn { background:color-mix(in srgb,var(--danger) 18%,var(--surface));
      color:var(--text); border:1px solid color-mix(in srgb,var(--danger) 40%,transparent); }
    main { flex:1; min-width:0; min-height:0; display:grid; place-items:center; }
    .view { width:100%; min-width:0; min-height:0; }
    #game { height:100%; min-height:0; display:flex; flex-direction:column; }
    .hidden { display:none!important; }
    body.completed-view #headerRulesBtn { display:none; }
    .card { border-radius:var(--radius-xl); padding:clamp(18px,3vw,32px); }
    .home,.complete { width:100%; min-width:0; max-width:940px; text-align:center; margin:auto; }
    .eyebrow,.tag { display:inline-flex; gap:7px; align-items:center; padding:7px 11px;
      border-radius:999px; border:1px solid var(--border); background:color-mix(in srgb,var(--accent) 16%,var(--surface));
      color:var(--text-soft); font-weight:700; font-size:.9rem; }
    .home h2,.complete h2 { font-size:clamp(2rem,5vw,3.5rem); line-height:1.04; margin:16px 0 12px; }
    .lede { max-width:660px; margin:0 auto; color:var(--text-soft); font-size:1.08rem; }
    .home-premise { max-width:760px; margin:18px auto 0; padding:16px 18px; text-align:left;
      border:2px solid var(--gold); border-radius:var(--radius-lg);
      background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 13%,var(--surface)),color-mix(in srgb,var(--accent) 7%,var(--surface))); }
    .home-premise h3 { margin:0 0 7px; color:var(--gold); font-size:.9rem; text-transform:uppercase; letter-spacing:.06em; }
    .home-premise p { margin:0; color:var(--text-soft); }
    .premise-steps { display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:12px 0 0; padding:0; list-style:none; }
    .premise-steps li { min-width:0; padding:9px 11px; border:1px solid var(--border); border-radius:var(--radius-md);
      background:color-mix(in srgb,var(--surface-2) 72%,transparent); color:var(--text-soft); font-size:.82rem; }
    .premise-steps b { display:block; color:var(--text); margin-bottom:3px; }
    .actions { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; margin-top:24px; }
    .toolbar { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; margin-bottom:12px; }
    .toolbar .right { display:flex; gap:8px; justify-content:flex-end; }
    .progress { color:var(--text-soft); text-align:center; font-weight:700; }
    .progress span { color:var(--gold); }
    .mission { padding:clamp(16px,2.5vw,26px); min-height:0; flex:1; overflow:hidden; }
    .game-layout { display:grid; grid-template-columns:minmax(250px,.78fr) minmax(0,1.45fr); gap:18px; height:100%; }
    .story-sidebar { min-width:0; min-height:0; display:flex; flex-direction:column; gap:10px; padding:12px;
      border:1px solid var(--border); border-radius:var(--radius-lg); background:color-mix(in srgb,var(--surface-2) 62%,var(--surface)); overflow:hidden; }
    .sidebar-kicker { margin:0; color:var(--gold); font-size:.75rem; font-weight:800; letter-spacing:.07em; text-transform:uppercase; }
    .sidebar-title { margin:2px 0 0; font-size:clamp(1.05rem,2vw,1.45rem); line-height:1.12; text-wrap:balance; }
    .sidebar-lede { margin:4px 0 0; color:var(--text-soft); font-size:.85rem; }
    .sidebar-passage { padding:9px 10px; border-left:4px solid var(--gold); border-radius:var(--radius-md);
      background:color-mix(in srgb,var(--gold) 9%,var(--surface)); color:var(--text-soft); font-size:.8rem; }
    .sidebar-passage h3 { margin:0 0 4px; color:var(--text); font-size:.78rem; text-transform:uppercase; letter-spacing:.06em; }
    .sidebar-passage p { margin:0; }
    .sidebar-focus { margin:0; padding:8px 10px; border:1px solid var(--border); border-radius:var(--radius-md);
      color:var(--text-soft); font-size:.78rem; background:var(--surface); }
    .sidebar-focus b { color:var(--text); }
    .story-sidebar .story-stage { grid-template-columns:1fr; gap:7px; margin:auto 0 0; min-height:0; }
    .story-sidebar .story-phone { display:none; }
    .story-sidebar .story-visual { grid-column:1; min-height:145px; padding:6px; }
    .story-sidebar .scene-legend { font-size:.65rem; }
    .story-sidebar .market-scene { min-height:100px; }
    .story-sidebar .scene-caption { font-size:.72rem; }
    .story-sidebar .evidence-progress { grid-column:1; }
    .home-art { display:none; width:100%; max-width:760px; margin:14px auto 0; }
    .home-art .story-stage { grid-template-columns:1fr; gap:8px; }
    .home-art .story-phone { display:none; }
    .home-art .story-visual { grid-column:1; min-height:180px; }
    .activity-pane { min-width:0; min-height:0; overflow:hidden; display:flex; flex-direction:column; }
    .activity-pane #screenContent { min-height:0; flex:1; overflow:hidden; }
    .screen-heading { margin:0 0 4px; font-size:clamp(1.55rem,3vw,2.2rem); text-wrap:balance; }
    .instruction,.screen-lede { margin:0 0 12px; color:var(--text-soft); }
    .screen-lede { max-width:780px; }
    .phone-stage { display:grid; grid-template-columns:minmax(126px,.55fr) minmax(320px,1.8fr) minmax(126px,.55fr);
      gap:14px; align-items:stretch; margin:14px 0 18px; }
    .phone { border:3px solid var(--person); border-radius:24px; padding:16px 12px; min-height:178px;
      background:color-mix(in srgb,var(--person) 12%,var(--surface)); text-align:center; display:flex;
      flex-direction:column; justify-content:center; gap:8px; position:relative; overflow:hidden; }
    .phone::before { content:""; width:42px; height:6px; background:var(--person); border-radius:999px; margin:0 auto; }
    .phone::after { content:""; position:absolute; inset:10px; border:1px solid color-mix(in srgb,var(--person) 38%,transparent);
      border-radius:18px; pointer-events:none; }
    .phone strong { color:var(--person); }
    .phone-detail { color:var(--muted); font-size:.78rem; }
    .maya { --person:var(--teal); } .joel { --person:var(--coral); }
    .avatar { width:42px; height:42px; display:grid; place-items:center; margin:0 auto; border-radius:50%;
      color:#10202a; font-weight:900; border:3px solid var(--surface); box-shadow:0 0 0 2px var(--person); }
    .avatar-maya { background:var(--teal); } .avatar-joel { background:var(--coral); }
    .split-art { position:relative; border:2px solid var(--gold); border-radius:var(--radius-lg); overflow:hidden;
      display:grid; place-items:center; min-height:180px; background:linear-gradient(135deg,
      color-mix(in srgb,var(--accent) 12%,var(--surface)),color-mix(in srgb,var(--accent-2) 12%,var(--surface))); }
    .split-art:not(.joined)::after { content:""; position:absolute; top:10px; bottom:10px; left:50%;
      border-left:4px dashed var(--gold); box-shadow:0 0 0 2px var(--surface); pointer-events:none; }
    .story-visual { display:grid; gap:8px; align-content:center; padding:10px; min-height:220px; }
    .scene-legend { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; color:var(--text-soft);
      font-size:.74rem; font-weight:700; }
    .legend-item { display:inline-flex; align-items:center; gap:5px; padding:4px 7px; border:1px solid var(--border);
      border-radius:999px; background:color-mix(in srgb,var(--surface) 72%,transparent); }
    .legend-item::before { content:""; width:9px; height:9px; display:inline-block; border-radius:50%; background:var(--gold); }
    .legend-item.maya::before { background:var(--teal); } .legend-item.joel::before { background:var(--coral); }
    .market-scene { display:block; width:100%; height:auto; min-height:158px; }
    .scene-fragment { opacity:.18; transition:opacity .28s ease,transform .28s ease; transform-box:fill-box; transform-origin:center; }
    .scene-fragment.on { opacity:1; transform:scale(1.015); }
    .scene-caption { margin:0; text-align:center; color:var(--text-soft); font-size:.82rem; }
    .evidence-progress { grid-column:1/-1; display:flex; flex-wrap:wrap; justify-content:center; gap:5px; margin-top:2px; }
    .evidence-progress span { min-width:28px; padding:3px 7px; text-align:center; border:1px solid var(--border);
      border-radius:999px; color:var(--muted); font-size:.75rem; font-weight:800; }
    .evidence-progress span.on { border-color:var(--success); color:var(--success); background:color-mix(in srgb,var(--success) 10%,transparent); }
    .story { border-left:4px solid var(--gold); background:color-mix(in srgb,var(--gold) 10%,var(--surface-2));
      padding:12px 14px; border-radius:var(--radius-md); margin:14px 0; }
    .evidence-read { margin:6px 0; padding:6px 9px; border-left:3px solid var(--gold); }
    .story::before { content:"Evidence panel"; display:block; margin-bottom:5px; color:var(--gold);
      font-size:.78rem; font-weight:800; letter-spacing:.05em; text-transform:uppercase; }
    .evidence-panel { margin:0 0 12px; padding:14px 16px; border:1px solid var(--border); border-left:5px solid var(--person, var(--gold));
      border-radius:var(--radius-lg); background:color-mix(in srgb,var(--person, var(--gold)) 9%,var(--surface)); }
    .evidence-panel h3 { margin:0 0 5px; font-size:.9rem; color:var(--person, var(--gold)); }
    .evidence-panel p { margin:0; color:var(--text-soft); }
    .question-card { margin:0 0 12px; padding:18px; border:1px solid var(--border); border-left:6px solid var(--gold);
      border-radius:var(--radius-lg); background:linear-gradient(135deg,color-mix(in srgb,var(--gold) 10%,var(--surface)),
      color-mix(in srgb,var(--accent) 7%,var(--surface))); }
    .activity-pane .question-card { padding:12px; }
    .activity-pane .question-instruction { margin-top:5px; font-size:.86rem; }
    .activity-pane .screen-lede { font-size:.9rem; margin-bottom:6px; }
    .question-card.active { border-color:color-mix(in srgb,var(--gold) 66%,var(--border)); box-shadow:0 8px 24px rgba(0,0,0,.12); }
    .question-card.completed { border-left-color:var(--success); background:color-mix(in srgb,var(--success) 7%,var(--surface)); }
    .question-meta { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-bottom:10px; }
    .question-number,.evidence-type { display:inline-flex; align-items:center; gap:6px; border-radius:999px; padding:5px 9px;
      font-size:.8rem; font-weight:800; }
    .question-number { background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
    .evidence-type { background:color-mix(in srgb,var(--gold) 18%,var(--surface)); color:var(--text-soft); }
    .question-title { margin:0; font-size:clamp(1.3rem,2.7vw,1.9rem); line-height:1.15; text-wrap:balance; }
    .question-instruction,.question-complete { margin:10px 0 0; color:var(--text-soft); }
    .completed-list { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:6px; margin:0 0 8px; max-height:58px; overflow:hidden; }
    .completed-item { display:block; padding:6px 8px; border:1px solid var(--border);
      border-radius:var(--radius-md); background:var(--surface-2); color:var(--text-soft); font-size:.68rem; line-height:1.15; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .completed-item br { display:none; } .completed-item .completed-answer { display:inline-block; margin-left:6px; font-weight:400; } .completed-item .check { margin-right:3px; }
    .completed-item .check { flex:0 0 auto; color:var(--success); font-weight:900; }
    .answer-label { margin:14px 0 7px; color:var(--text-soft); font-size:.86rem; font-weight:800; text-transform:uppercase; letter-spacing:.04em; }
    .choices { display:grid; gap:8px; }
    .choice { width:100%; text-align:left; position:relative; border-radius:999px; padding:12px 16px;
      background:var(--surface-2); color:var(--text); border:1px solid var(--border); }
    .choice .symbol { display:inline-grid; place-items:center; width:27px; height:27px; margin-right:9px; border-radius:50%; vertical-align:middle;
      font-weight:800; background:var(--surface); border:1px solid var(--border); }
    .choice.selected { outline:3px solid var(--gold); }
    .tile.selected { outline:3px solid var(--gold); border-color:var(--gold); }
    .choice.correct { border-color:var(--success); background:color-mix(in srgb,var(--success) 16%,var(--surface)); }
    .target { width:100%; margin-top:10px; border:2px dashed var(--gold); border-radius:999px; padding:12px 16px;
      background:color-mix(in srgb,var(--gold) 9%,var(--surface)); color:var(--text); text-align:left; font-weight:800; }
    .target:hover { background:color-mix(in srgb,var(--gold) 17%,var(--surface)); }
    .locked { margin-top:10px; color:var(--success); font-weight:700; }
    .feedback { margin-top:10px; padding:14px; border-radius:var(--radius-md); border:1px solid var(--danger);
      background:color-mix(in srgb,var(--danger) 12%,var(--surface)); }
    .feedback strong { display:block; color:var(--text); }
    .feedback p { margin:6px 0; }
    .hint { padding:12px 14px; border-left:5px solid var(--gold); border-radius:10px;
      background:color-mix(in srgb,var(--gold) 10%,var(--surface-2)); color:var(--text-soft); }
    .next-row { display:flex; justify-content:flex-end; margin-top:18px; }
    .merge-grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .speech { border-radius:var(--radius-lg); padding:14px; background:var(--surface-2); border:1px solid var(--border); position:relative; }
    .speech.maya-speech { border-left:5px solid var(--teal); } .speech.joel-speech { border-left:5px solid var(--coral); }
    .speech::after { content:""; position:absolute; bottom:-9px; width:16px; height:16px; background:inherit;
      border-right:1px solid var(--border); border-bottom:1px solid var(--border); transform:rotate(45deg); }
    .maya-speech::after { left:24px; } .joel-speech::after { right:24px; }
    .chat-thread { display:grid; gap:10px; margin:0 0 12px; padding:12px; border:1px solid var(--border); border-radius:var(--radius-lg);
      background:color-mix(in srgb,var(--accent) 5%,var(--surface)); }
    .chat-bubble { max-width:92%; padding:12px 15px; border:1px solid var(--border); border-radius:18px; color:var(--text); }
    .chat-bubble p { margin:4px 0 0; }
    .chat-bubble.maya { justify-self:start; border-left:5px solid var(--teal); border-bottom-left-radius:7px; background:color-mix(in srgb,var(--teal) 11%,var(--surface-2)); }
    .chat-bubble.joel { justify-self:end; border-left:5px solid var(--coral); border-bottom-right-radius:7px; background:color-mix(in srgb,var(--coral) 11%,var(--surface-2)); }
    .response-drop { min-height:60px; margin-top:8px; padding:12px 14px; border:2px dashed var(--gold); border-radius:16px;
      color:var(--text-soft); background:color-mix(in srgb,var(--gold) 7%,var(--surface)); }
    .response-drop.filled { border-style:solid; border-color:var(--success); color:var(--text); background:color-mix(in srgb,var(--success) 10%,var(--surface)); }
    .response-tray { margin-top:10px; padding:12px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface); }
    .merge-interaction { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; align-items:start; }
    .reflection-canvas { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); gap:10px; margin-top:14px; }
    .reflection-slots,.reflection-bank { min-width:0; }
    .reflection-canvas > .primary,.reflection-canvas > .feedback { grid-column:1/-1; }
    .sentence-builders { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .sentence-builder { min-width:0; padding:9px; border:1px solid var(--border); border-radius:var(--radius-md); background:color-mix(in srgb,var(--accent) 5%,var(--surface)); }
    .sentence-builder h3 { margin:0; color:var(--text); font-size:.86rem; }
    .sentence-builder .builder-note { margin:3px 0 6px; color:var(--muted); font-size:.74rem; line-height:1.15; }
    .sentence-builder .order { display:block; min-height:82px; padding:12px 10px; line-height:1.45; border:1px solid color-mix(in srgb,var(--gold) 42%,var(--border)); border-radius:var(--radius-md); background:color-mix(in srgb,var(--surface) 78%,var(--gold)); }
    .sentence-builder .order-slot { display:inline-flex; width:auto; max-width:100%; min-width:44px; min-height:44px; max-height:none; margin:2px 6px 2px 0; padding:6px 4px 5px; border:0; border-bottom:2px dashed var(--gold); border-radius:0; background:transparent; align-items:flex-start; vertical-align:middle; overflow:visible; text-align:left; white-space:normal; }
    .sentence-builder .order-slot.filled { position:relative; padding-right:27px; border-bottom-color:var(--success); background:transparent; }
    .sentence-builder .order-slot.filled .slot-number { display:none; }
    .sentence-builder .order-slot:not(.filled) { min-width:120px; }
    .sentence-builder .slot-number { flex:0 0 auto; width:auto; height:auto; min-width:0; border:0; border-radius:0; background:transparent; color:var(--gold); font-size:.72rem; line-height:1.5; }
    .sentence-builder .slot-number::after { content:"."; }
    .sentence-builder .slot-copy { display:block; -webkit-line-clamp:initial; overflow:visible; color:var(--text-soft); line-height:1.25; }
    .sentence-builder .slot-action { position:absolute; right:6px; top:50%; transform:translateY(-50%); display:grid; place-items:center; width:14px; height:14px; color:var(--muted); font-weight:900; font-size:.68rem; line-height:1; }
    .reflection-canvas { margin-top:42px; }
    .tile-empty { margin:4px 0 0; color:var(--muted); font-size:.75rem; line-height:1.2; }
    .reflection-bank > .primary { width:100%; margin-top:8px; }
    #screenContent:has(.reflection-canvas) .tile-empty { display:none; }
    .reflection-result { padding:12px 14px; border:1px solid var(--success); border-radius:var(--radius-md);
      background:color-mix(in srgb,var(--success) 9%,var(--surface)); color:var(--text-soft); }
    .reflection-result b { color:var(--success); } .reflection-result p { margin:6px 0 0; }
    .order { display:grid; gap:9px; min-height:80px; padding:12px; border:2px dashed var(--gold);
      border-radius:14px; background:color-mix(in srgb,var(--gold) 7%,var(--surface)); }
    .order button,.tile { min-height:52px; border-radius:999px; text-align:left; background:var(--surface-2);
      color:var(--text); border:1px solid var(--border); padding:12px 16px; }

  <script>

    const prompts={

        ["maya-hidden","What does Maya not know?","Hidden information","Joel’s bus broke down",["The bench is empty at 3:30 p.m.","Maya waited for ten minutes"],"narrator_knowledge"],
        ["maya-reaction","Which reaction fits Maya’s information?","Likely reaction","feels ignored",["feels pleased that the bus was delayed","feels certain Joel did not try"],"relationship_reaction"],
        ["maya-label","Who tells Maya’s side?","Point-of-view label","first person",["second person","third person"],"narrator_knowledge"]

      joel:[
        ["joel-known","What does Joel know?","Known fact","The bus broke down",["Maya left after ten minutes","Maya saw an empty bench"],"narrator_knowledge"],
        ["joel-hidden","What does Joel not know?","Hidden information","Maya left after ten minutes",["The bus broke down","His message stayed unsent"],"narrator_knowledge"],

      "maya-label":"narrator_knowledge","joel-known":"narrator_knowledge","joel-hidden":"narrator_knowledge",

    function safeReducedMotion(){try{return window.matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){return false;}}
    function updateStorageNote(){
      document.querySelectorAll("#storageNote,[data-storage-note]").forEach(node=>node.classList.toggle("hidden",!(memoryOnly||storageFallback)));

    function storageGet(key){
      try{const value=window.localStorage.getItem(key); return value;}catch(e){}

    }
    function storageRemove(key){

    }
    function fresh(){
      return {
        version:VERSION,current:"maya",completed:[],placements:{},selectedResponses:{},reflectionOrder:[],
        checks:Object.fromEntries(allIds.map(id=>[id,{mastered:false,attempts:0,first:null,hint:false}])),
        completion:false,finalMastery:0,totalAttempts:0,distinctHints:0,activeTimeMs:0,
        startTime:null,completionTime:null,missedFocusSkills:[],reducedMotion:safeReducedMotion()

    }
    function isPlain(value){return value&&typeof value==="object"&&!Array.isArray(value);}

    function validMap(map,allowed){
      if(!isPlain(map))return false;

    }
    function cleanState(saved){
      if(!isPlain(saved)||saved.version!==VERSION||!validScreens.includes(saved.current))return fresh();
      if(!Array.isArray(saved.completed)||saved.completed.some(x=>!validScreens.includes(x)))return fresh();
      if(!Array.isArray(saved.reflectionOrder)||saved.reflectionOrder.length>reflectionTiles.length||
        new Set(saved.reflectionOrder).size!==saved.reflectionOrder.length||saved.reflectionOrder.some(x=>!reflectionTiles.includes(x)))return fresh();
      const placementAllowed=Object.fromEntries(Object.entries(answers).filter(([id])=>!id.startsWith("merge-")));
      const responseAllowed={"merge-joel":answers["merge-joel"],"merge-maya":answers["merge-maya"]};
      if(!validMap(saved.placements,placementAllowed)||!validMap(saved.selectedResponses,responseAllowed))return fresh();
      if(typeof saved.completion!=="boolean"||!validDate(saved.startTime)||!validDate(saved.completionTime)||
        typeof saved.reducedMotion!=="boolean"||!Number.isFinite(saved.activeTimeMs)||saved.activeTimeMs<0)return fresh();
      if(!isPlain(saved.checks)||allIds.some(id=>{
        const check=saved.checks[id];
        return !isPlain(check)||typeof check.mastered!=="boolean"||!Number.isSafeInteger(check.attempts)||
          check.attempts<0||(check.first!==null&&typeof check.first!=="boolean")||typeof check.hint!=="boolean";
      }))return fresh();
      const checks=Object.fromEntries(allIds.map(id=>{
        const c=saved.checks[id]; return [id,{mastered:c.mastered,attempts:c.attempts,first:c.first,hint:c.hint}];
      }));
      const complete=allIds.every(id=>checks[id].mastered);
      const missed=[...new Set(allIds.filter(id=>checks[id].first===false).map(id=>skills[id]))];
      return {
        ...fresh(),current:saved.current,completed:[...new Set(saved.completed)],placements:{...saved.placements},
        selectedResponses:{...saved.selectedResponses},reflectionOrder:[...saved.reflectionOrder],checks,
        completion:complete,finalMastery:Math.round(allIds.filter(id=>checks[id].mastered).length/TOTAL*100),
        totalAttempts:allIds.reduce((n,id)=>n+checks[id].attempts,0),distinctHints:allIds.filter(id=>checks[id].hint).length,
        activeTimeMs:saved.activeTimeMs,startTime:saved.startTime,completionTime:complete?(saved.completionTime||new Date().toISOString()):null,
        missedFocusSkills:missed,reducedMotion:saved.reducedMotion

    }
    function count(){return allIds.filter(id=>state.checks[id].mastered).length;}
    function syncReport(){
      state.totalAttempts=allIds.reduce((n,id)=>n+state.checks[id].attempts,0);
      state.distinctHints=allIds.filter(id=>state.checks[id].hint).length;

    }

      memoryModalContent.querySelectorAll("[data-memory-screen]").forEach(button=>button.addEventListener("click",()=>{
        app.reviewMode=true; app.reviewScreen=button.dataset.memoryScreen; app.reviewOrigin=state.current; app.reviewFromMemory=true; app.reviewReturnCompletion=!!state.completion;
        closeMemory(); setView("game");
      }));
      updateStorageNote();
    }
    function renderCompletion(){
      home.classList.remove("hidden"); game.classList.add("hidden");
      document.body.classList.add("completed-view");
      home.innerHTML='<div class="complete"><div class="eyebrow">Mission complete</div><h2>Both sides understood</h2><div class="art-final">'+art()+
        '</div><p class="lede">You explained how viewpoint changes interpretation and responded respectfully.</p><p class="status-note">Final mastery: '+state.finalMastery+
        '% · First-attempt accuracy: '+Math.round(allIds.filter(id=>state.checks[id].first).length/TOTAL*100)+
        '% · Total attempts: '+state.totalAttempts+'</p><div class="actions"><button id="reviewBtn" type="button">Review</button>'+
        '<button id="playAgain" class="primary" type="button">Play again</button></div></div>';
      $("reviewBtn").onclick=()=>openMemory();
      $("playAgain").onclick=()=>openModal("reset");
      updateStorageNote();
    }
    function finishScreen(){
      if(!state.completion){
        state.completion=true; state.finalMastery=Math.round(count()/TOTAL*100);
        if(!state.completionTime)state.completionTime=new Date().toISOString();
      }
      pause(); save(); setView("home");
    }
    function advance(){
      const current=app.reviewMode?app.reviewScreen:state.current;
      const next={maya:"joel",joel:"merge",merge:"reflection",reflection:"complete"}[current];
      if(app.reviewMode){if(next==="complete")setView("memory");else go(next);return;}
      if(!state.completed.includes(state.current))state.completed.push(state.current);
      if(next==="complete")finishScreen();else go(next);
    }
    function check(id,value){
      if(app.reviewMode||state.checks[id].mastered)return;
      let correct=false;
      if(id==="merge-joel")correct=value===answers["merge-joel"];
      else if(id==="merge-maya")correct=value===answers["merge-maya"];
      else{const entry=[...prompts.maya,...prompts.joel].find(item=>item[0]===id);correct=!!entry&&value===entry[3];}
      mark(id,correct); app.selected=null;
      if(correct){
        if(id.startsWith("merge-"))state.selectedResponses[id]=value;else state.placements[id]=value;
        app.feedback=null; save(); announce("Correct. Evidence "+(allIds.indexOf(id)+1)+" is now lit."); render();
      }else{
        app.feedback={id}; render(); setTimeout(()=>$("feedback")?.focus(),0);
        announce("That card does not fit this viewpoint. Choose another card.");
      }
    }
    function reject(id){
      if(app.reviewMode)return;
      mark(id,false); app.selected=null; app.feedback={id}; render();
      setTimeout(()=>$("feedback")?.focus(),0);
      announce("That card does not fit this placement target. Choose another card.");
    }
    function reflection(){
      if(app.reviewMode)return;
      const exact=reflectionTiles,correct=state.reflectionOrder.length===exact.length&&state.reflectionOrder.every((tile,i)=>tile===exact[i]);
      mark("reflection",correct);
      if(correct){app.feedback=null;announce("Correct. Your exact reflection is complete.");render();}
      else{app.feedback={id:"reflection"};render();setTimeout(()=>$("feedback")?.focus(),0);announce("The reflection order needs adjusting.");}
    }
    function placeReflection(tile,index){
      if(!reflectionTiles.includes(tile)||app.reviewMode||state.checks.reflection.mastered)return;
      const next=state.reflectionOrder.filter(item=>item!==tile);
      next.splice(Math.max(0,Math.min(Number(index),next.length)),0,tile);
      state.reflectionOrder=next; app.selected=null; save(); render();
      announce("Tile placed in sentence slot "+(Number(index)+1)+".");
    }
    function hint(){
      if(app.reviewMode){announce("Hints are unavailable in read-only memory.");return;}
      const id=state.current==="maya"?"maya-known":state.current==="joel"?"joel-known":state.current==="merge"?"merge-joel":"reflection";
      state.checks[id].hint=true; save(); openModal("hint");
    }
    function focusTrap(event){
      if(event.key!=="Tab")return;
      const dialog=event.currentTarget||modal;
      const items=[...dialog.querySelectorAll("button,input:not([disabled])")];if(!items.length)return;
      const first=items[0],last=items[items.length-1];
      if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
      else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
    }
    function launchMission(){
      app.reviewMode=false; app.reviewScreen=null;
      setView("game");
    }
    function openMemory(){
      app.memoryFocus=document.activeElement;
      if(app.screen==="game"&&!app.reviewMode&&!state.completion)pause();
      renderMemory();
      memoryModal.classList.add("show"); memoryModal.onkeydown=focusTrap;
      $("memoryDone")?.focus(); announce("Saved memory opened. Your current screen is paused.");
    }
    function closeMemory(){
      memoryModal.classList.remove("show"); memoryModal.onkeydown=null;
      if(app.memoryFocus&&app.memoryFocus.isConnected)app.memoryFocus.focus(); app.memoryFocus=null;
      if(app.screen==="game"&&!app.reviewMode&&!state.completion)resume();
      announce("Saved memory closed. You are back at your current screen.");
    }
    function openModal(kind,after){
      app.lastFocus=document.activeElement; app.modalAfter=after||null;
      const rules='<h2 id="modalTitle">Rules</h2><ul><li>Use only what each person sees, knows or receives.</li><li>Different information can lead to different reactions and judgements.</li><li>Respectful responses ask about evidence instead of attacking a person.</li></ul><label class="check-row"><input id="motionToggle" type="checkbox" '+(state.reducedMotion?"checked":"")+'> Reduce motion</label><div class="actions"><button id="modalDone" class="primary" type="button">'+(after==="mission"?"I understand. Start mission":"Done")+"</button></div>";
      const reset='<h2 id="modalTitle">Reset mission?</h2><p>Reset clears saved evidence and reporting data. You cannot undo this action.</p><div class="actions"><button id="modalDone" type="button">Cancel</button><button id="confirmReset" class="danger" type="button">Reset mission</button></div>';
      const h='<h2 id="modalTitle">Hint</h2><p>'+esc(hints[state.current]||hints.maya)+'</p><div class="actions"><button id="modalDone" class="primary" type="button">Got it</button></div>';
      modalContent.innerHTML=kind==="rules"?rules:kind==="reset"?reset:h;
      modal.classList.add("show"); modal.onkeydown=focusTrap; $("modalDone")?.focus();
      $("modalDone")?.addEventListener("click",()=>{
        const continueMission=app.modalAfter==="mission"; closeModal(); if(continueMission)launchMission();
      });
      $("motionToggle")?.addEventListener("change",event=>{state.reducedMotion=event.target.checked;save();document.body.classList.toggle("reduced",state.reducedMotion);});
      $("confirmReset")?.addEventListener("click",()=>{
        const keepMotion=state.reducedMotion; storageRemove(KEY); state=fresh(); state.reducedMotion=keepMotion; activeStart=null; app.selected=null; app.feedback=null;
        save(); $("progress").innerHTML="Mission progress: <span>0 of "+TOTAL+"</span>";
        closeModal(); app.screen="home"; home.classList.remove("hidden"); game.classList.add("hidden"); restoreHome(); window.scrollTo({top:0,behavior:"auto"}); announce("Mission data reset.");
      });
    }
    function closeModal(){
      modal.classList.remove("show"); modal.onkeydown=null; app.modalAfter=null;
      if(app.lastFocus&&app.lastFocus.isConnected)app.lastFocus.focus(); app.lastFocus=null;
    }
    function restoreHome(){
      if(state.completion){renderCompletion();return;}
      document.body.classList.remove("completed-view");
      home.innerHTML='<div class="eyebrow">Mission: two phone screens</div><h2>See both sides before you judge.</h2><p class="lede">Maya and Joel missed a meeting. Use the information on each phone to rebuild their shared picture.</p>'+
        '<section class="home-premise"><h3>Mission premise</h3><p>Maya and Joel plan to meet at a Caribbean market bench at 3:30 p.m. Maya arrives first, sees an empty bench, waits ten minutes, and leaves. Joel’s bus breaks down on the way, and his message stays unsent until the signal returns. You will compare what each person knows before deciding what the missed meeting means.</p><ol class="premise-steps"><li><b>1 · Maya arrives</b>She sees the empty bench and waits.</li><li><b>2 · Joel is delayed</b>His bus breaks down and the message cannot send.</li><li><b>3 · You rebuild the picture</b>Separate facts, reactions, and judgement.</li></ol></section><div class="home-art">'+art()+'</div><div class="actions"><button id="startBtn" class="primary" type="button">'+(count()?"Resume mission":"Start mission")+
        '</button></div>';
      $("startBtn").onclick=()=>openModal("rules","mission");
      updateStorageNote();
    }
    document.addEventListener("click",event=>{
      const button=event.target.closest("button"); if(!button)return;
      if(button.dataset.card){
        if(button.disabled)return;
        app.selected={id:button.dataset.id,value:button.dataset.card}; render();
        announce("Card selected. Choose its named placement target."); return;
      }
      if(button.dataset.reflectionTarget!==undefined){
        if(button.disabled)return;
        if(app.selected&&app.selected.kind==="reflection")placeReflection(app.selected.value,button.dataset.slot);
        else if(button.dataset.remove!==undefined){state.reflectionOrder.splice(Number(button.dataset.remove),1);save();render();announce("Tile removed from the sentence slots.");}
        else announce("Select a supplied tile before placing it.");
        return;
      }
      if(button.dataset.target){
        if(app.selected&&app.selected.id===button.dataset.target)check(button.dataset.target,app.selected.value);
        else announce("Select a card before placing it."); return;
      }
      if(button.dataset.action==="next"){advance();return;}
      if(button.dataset.action==="submit-reflection"){reflection();return;}
      if(button.dataset.tile){
        if(button.disabled)return;
        app.selected={kind:"reflection",value:button.dataset.tile}; render(); announce("Tile selected. Choose a numbered sentence slot."); return;
      }
      if(button.dataset.remove!==undefined){state.reflectionOrder.splice(Number(button.dataset.remove),1);save();render();}
    });
    document.addEventListener("pointerdown",event=>{
      const card=event.target.closest("[data-card]"),tile=event.target.closest("[data-tile]"),placed=event.target.closest("[data-placed-tile]");
      dragIntent=card?Object.freeze({id:card.dataset.id,value:card.dataset.card}):tile?Object.freeze({kind:"reflection",value:tile.dataset.tile}):placed?Object.freeze({kind:"reflection",value:placed.dataset.placedTile}):null;
    });
    document.addEventListener("pointerup",()=>{dragIntent=null;});
    document.addEventListener("pointercancel",()=>{dragIntent=null;});
    document.addEventListener("dragstart",event=>{
      const card=event.target.closest("[data-card]"),tile=event.target.closest("[data-tile]"),placed=event.target.closest("[data-placed-tile]"),data=dragIntent||(card&&{id:card.dataset.id,value:card.dataset.card})||(tile&&{kind:"reflection",value:tile.dataset.tile})||(placed&&{kind:"reflection",value:placed.dataset.placedTile});
      if(data)event.dataTransfer.setData("text/plain",JSON.stringify(data));
    });
    document.addEventListener("dragend",()=>{dragIntent=null;});
    content.addEventListener("dragover",event=>{if(event.target.closest("[data-target],[data-reflection-target]"))event.preventDefault();});
    content.addEventListener("drop",event=>{
      const target=event.target.closest("[data-target],[data-reflection-target]");if(!target)return;event.preventDefault();
      try{
        const data=JSON.parse(event.dataTransfer.getData("text/plain"));
        if(target.dataset.reflectionTarget!==undefined){
          if(data.kind==="reflection")placeReflection(data.value,target.dataset.slot);else announce("Drag a reflection tile into this sentence slot.");
        }else if(data.id===target.dataset.target)check(data.id,data.value);else reject(target.dataset.target);
      }catch(e){announce("Choose a card or reflection tile and place it on its named target.");}
    });
    document.addEventListener("keydown",event=>{
      if(event.key==="Escape"&&memoryModal.classList.contains("show")){closeMemory();return;}
      if(event.key==="Escape"&&modal.classList.contains("show")){closeModal();return;}
      if(event.key==="Escape"&&app.selected){app.selected=null;render();announce("Card selection cancelled.");return;}
      if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(event.key)&&document.activeElement.matches(".choice,.target,[data-tile],[data-reflection-target]")){
        const choices=[...content.querySelectorAll(".choice:not([disabled]),.target:not([disabled]),[data-tile]:not([disabled]),[data-reflection-target]:not([disabled])")];
        const index=choices.indexOf(document.activeElement);
        if(index>=0){event.preventDefault();const forward=["ArrowRight","ArrowDown"].includes(event.key);choices[(index+(forward?1:-1)+choices.length)%choices.length].focus();}
      }
    });
    $("themeBtn").onclick=()=>{
      const light=document.documentElement.dataset.theme!=="light"; setTheme(light?"light":"dark",true);
    };
    $("fullBtn").onclick=async()=>{
      try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}
      catch(e){announce("Full screen is not available in this browser.");}
    };
    document.addEventListener("fullscreenchange",()=>{
      const full=!!document.fullscreenElement;
      $("fullBtn").innerHTML=full?'<svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3"></path><path d="M21 8h-3a2 2 0 0 1-2-2V3"></path><path d="M3 16h3a2 2 0 0 1 2 2v3"></path><path d="M16 21v-3a2 2 0 0 1 2-2h3"></path></svg> Exit Full Screen':'<svg class="btn-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"></path><path d="M16 3h3a2 2 0 0 1 2 2v3"></path><path d="M8 21H5a2 2 0 0 1-2-2v-3"></path><path d="M16 21h3a2 2 0 0 0 2-2v-3"></path></svg> Full Screen';
      $("fullBtn").setAttribute("aria-label",full?"Exit full screen":"Enter full screen");
    });
    $("resetBtn").onclick=()=>openModal("reset");
    $("headerRulesBtn").onclick=()=>openModal("rules");
    $("memoryBtn").onclick=openMemory;
    $("hintBtn").onclick=hint;
    $("backBtn").onclick=()=>{
      if(app.reviewMode&&app.reviewFromMemory){
        const returnToCompletion=app.reviewReturnCompletion;
        app.reviewMode=false; app.reviewScreen=null; app.reviewFromMemory=false; app.reviewReturnCompletion=false;
        if(returnToCompletion)setView("home");else setView("game");
        openMemory(); return;
      }
      const current=app.reviewMode?app.reviewScreen:state.current;
      const previous={joel:"maya",merge:"joel",reflection:"merge"}[current];
      if(previous)go(previous);else if(app.reviewMode)setView("memory");
    };
    $("closeModal").onclick=closeModal;
    modal.addEventListener("click",event=>{if(event.target===modal)closeModal();});
    $("closeMemory").onclick=closeMemory;
    memoryModal.addEventListener("click",event=>{if(event.target===memoryModal)closeMemory();});
    document.addEventListener("visibilitychange",()=>{if(document.hidden)pause();else if(app.screen==="game"&&!state.completion&&!app.reviewMode)resume();});
    state=load(); loadTheme(); restoreHome(); updateStorageNote();
  })();
  </script>
</body>
</html>
